
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Enorden</title>
<style>
:root{
 --bg:#f2ecdf;--surface:#fffaf1;--surface2:#e9e0d0;
 --green:#24564f;--green2:#326b61;--white:#242820;
 --muted:#70736c;--line:#d9d0c1;--gold:#bd9144;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#242820;
 font-family:Arial,Helvetica,sans-serif;font-size:15px}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:650px;margin:auto;min-height:100vh}
header{height:76px;background:var(--green);padding:12px 17px;
 display:flex;align-items:center;justify-content:space-between;
 position:sticky;top:0;z-index:10}
.brand{font-size:25px;font-weight:700;color:#fff}
.slogan{font-size:11px;color:#dce8e3;margin-top:3px}
.header-actions{display:flex;gap:10px}
.icon-btn{width:39px;height:39px;border:0;border-radius:50%;
 background:#ffffff18;color:white;display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;
 fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.icon-btn:active{background:#ffffff22}
.settings-accordion{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.settings-accordion summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;cursor:pointer;font-weight:700;color:#30352d}
.settings-accordion summary::-webkit-details-marker{display:none}
.settings-accordion > summary::after{content:'⌄';font-size:20px;color:#687066;transition:transform .18s}
.settings-accordion[open] > summary::after{transform:rotate(180deg)}
.accordion-content{padding:0 16px 16px;border-top:1px solid var(--line)}
.accordion-content .settings-row:first-child{margin-top:4px}
main{padding:21px 17px 35px}
h1,h2,h3,p{margin-top:0}
h1{font-size:25px;margin-bottom:8px}
h2{font-size:18px;margin-bottom:13px}
.muted{color:var(--muted)}
.dayline{display:flex;align-items:baseline;gap:8px;margin:3px 0 15px}
.dayline strong{font-size:19px;color:#242820;text-transform:capitalize}
.dayline span{font-size:15px;color:#74766f}
.greeting{font-size:29px;font-weight:700;margin:0 0 9px}
.weather{display:flex;align-items:center;gap:8px;font-size:16px;
 color:#555a51;margin-bottom:10px}
.weather-icon{font-size:20px}
.summary-intro{font-size:13px;color:var(--muted);margin-bottom:17px}
.searchbox{display:flex;align-items:center;gap:8px;
 background:var(--surface);border:1px solid var(--line);
 border-radius:13px;padding:4px 7px;margin-bottom:20px}
.searchbox input{flex:1;min-width:0;background:transparent;
 color:#242820;border:0;outline:none;padding:11px 7px}
.searchbox button{border:0;border-radius:9px;background:var(--green);
 color:white;padding:9px 11px}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.summary-card{background:var(--surface);border:1px solid var(--line);
 border-radius:13px;padding:13px 9px;min-height:94px;color:#242820;text-align:left}
.summary-card .number{font-size:25px;font-weight:700;margin-bottom:5px}
.summary-card .label{font-size:11px;color:#70736c;line-height:1.3}
.section{margin-top:27px}
.section-title{font-size:18px;font-weight:700;margin-bottom:13px}
.module-strip,.bottom-nav{display:flex;gap:9px;overflow-x:auto;
 scrollbar-width:thin;scrollbar-color:#555 transparent;
 -webkit-overflow-scrolling:touch}
.module-strip{padding:2px 1px 12px;scroll-snap-type:x proximity}
.module-tile{flex:0 0 88px;min-height:88px;scroll-snap-align:start;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:8px;background:var(--surface);border:1px solid var(--line);
 color:#242820;border-radius:14px;padding:10px 5px;touch-action:pan-x}
.module-tile .emoji{font-size:24px}
.module-tile span:last-child{font-size:11px;text-align:center}
.hint{font-size:11px;line-height:1.5;color:#999;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);
 border-radius:14px;padding:15px;margin-bottom:11px;color:#242820}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.page-heading{margin-bottom:18px}
.page-heading p{font-size:13px;color:var(--muted);margin:5px 0 0}
.toolbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.small-btn,.primary-btn,.secondary-btn{border:0;border-radius:9px;padding:10px 13px}
.small-btn{background:var(--surface2);color:#30352d;white-space:nowrap}
.small-btn.active,.primary-btn{background:var(--green2);color:white}
.secondary-btn{background:var(--surface2);color:#30352d}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
 gap:5px;text-align:center}
.calendar-grid div{padding:10px 1px;border-radius:8px;font-size:12px;color:#30352d}
.calendar-grid .weekday{color:#70736c;font-weight:700}
.calendar-grid .today{background:var(--green2);color:white}
.calendar-grid .has-event{border:1px solid var(--gold)}
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.month-tile{padding:15px 4px;background:var(--surface2);color:white;
 border:1px solid var(--line);border-radius:10px}
.task-row,.setting-row{display:flex;align-items:center;gap:10px;
 padding:12px 0;border-bottom:1px solid var(--line)}
.task-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--green2)}
.task-row .task-name{flex:1}
.done{text-decoration:line-through;color:var(--muted)}
.list-section h3{font-size:14px;color:#444a40;margin:0 0 9px}
.empty{text-align:center;color:var(--muted);padding:20px 8px}
.pill{font-size:11px;background:#e0ebe3;color:#24564f;
 padding:5px 9px;border-radius:20px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(650px,100%);background:#fffaf1;border-top:1px solid #d9d0c1;
 padding:9px 7px max(10px,env(safe-area-inset-bottom));
 z-index:15;gap:5px;scrollbar-width:none;justify-content:flex-start}
.bottom-nav::-webkit-scrollbar{display:none}
.nav-btn{flex:0 0 76px;min-width:76px;border:0;background:transparent;
 color:#72756d;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:5px;padding:5px 2px;border-radius:10px;
 touch-action:pan-x}
.nav-btn.active{color:#fff;background:#2c4842}
.nav-icon{font-size:20px;line-height:23px}
.nav-label{font-size:10px;white-space:nowrap}
.hidden{display:none!important}
.fab{position:fixed;bottom:83px;right:max(20px,calc((100vw - 610px)/2));
 width:52px;height:52px;border:0;border-radius:50%;
 background:var(--green2);color:white;font-size:29px;z-index:12}
.modal-backdrop{position:fixed;inset:0;background:#0008;z-index:30;
 display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.show{display:flex}
.modal{background:#fffaf1;color:#242820;width:min(650px,100%);padding:22px;
 border-radius:20px;max-height:85vh;overflow:auto}
.modal input,.modal select{width:100%;background:#fff;color:#242820;
 border:1px solid #d1c8b8;border-radius:9px;padding:12px;margin:6px 0 13px}
.modal label{font-size:12px;color:#60645c}
.close-row{display:flex;justify-content:space-between;align-items:center}
.modal h2{margin:0 0 18px}
.close-row{margin-bottom:12px;gap:12px}.close-row h2{margin:0;min-width:0}.close-row .small-btn{flex:0 0 auto;white-space:nowrap}.event-form-subtitle{font-size:14px;line-height:1.45;color:#62675e;margin:0 0 18px;position:relative;clear:both}.event-form-section{margin:15px 0}.event-form-section>label:not(.event-choice),.event-form-section>.field-label{display:block;font-size:13px;font-weight:700;color:#42483f;margin:0 0 6px}.event-form-section input:not([type=checkbox]):not([type=color]),.event-form-section select{width:100%;background:#fff;color:#242820;border:1px solid #d1c8b8;border-radius:9px;padding:11px;margin:5px 0 8px}.event-form-section input[type=checkbox],.event-form-section input[type=radio]{accent-color:var(--green2);width:17px;height:17px}.event-two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.event-choice-row{display:flex;gap:8px;flex-wrap:wrap}.event-choice{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:12px;margin:5px 0}.event-alert-row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:center}.event-preview{background:#f4efe5;border:1px solid var(--line);border-radius:12px;padding:13px;margin:16px 0}.event-preview-title{font-weight:700;font-size:15px;margin-bottom:5px}.event-form-actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.event-form-actions button{min-width:112px}.event-color{width:100%;height:40px;padding:3px!important}.event-days{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.event-days label{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px}
.event-form-section{min-width:0}
.event-choice{display:flex;align-items:center;flex-wrap:wrap;max-width:100%;white-space:normal;line-height:1.4}
.event-choice input[type=checkbox],.event-choice input[type=radio]{flex:0 0 17px;width:17px;min-width:17px;margin:0}
.event-two-col{grid-template-columns:repeat(2,minmax(0,1fr));min-width:0}
.event-two-col>div{min-width:0}
.event-alert-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.event-form-actions button{flex:1;min-width:0;white-space:normal;line-height:1.25;padding:12px 8px}
.event-form-section input,.event-form-section select{min-width:0;max-width:100%}

.bottom-space{height:75px}
.plain-heading{font-size:16px;font-weight:700;margin:23px 0 8px;color:#242820}
.home-code{font-size:25px;font-weight:800;letter-spacing:2px;color:#39ed63;
 background:#1c3225;border-radius:12px;padding:15px;text-align:center;overflow-wrap:anywhere}
.settings-action{width:100%;text-align:left;background:var(--surface);color:#242820;
 border:1px solid var(--line);border-radius:12px;padding:14px;margin:6px 0}
.settings-action.danger{color:#a13b35;border-color:#dfbdb5}
.home-code-actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.home-code-actions button{min-width:112px}
.help-group{margin:10px 0}
.help-group summary{font-weight:700;cursor:pointer;padding:12px 0;color:#30352d;list-style:none;display:flex;align-items:center;gap:12px}
.help-group > summary::-webkit-details-marker{display:none}
.help-group > summary::marker{content:''}
.help-group > summary{list-style:none}
.help-group > summary::after{content:none!important;display:none!important}
.help-main-group > summary{justify-content:space-between}
.help-main-group > summary::after{content:'⌄';font-size:20px;color:#687066;transition:transform .18s;flex:0 0 auto}
.help-main-group[open] > summary::after{transform:rotate(180deg)}
.help-answer{font-size:13px;line-height:1.55;color:#555b52;padding:0 0 12px}
.profile-option{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 2px;color:#30352d}
.profile-option:last-child{border-bottom:0}
.profile-avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--surface2);display:grid;place-items:center;font-size:36px;margin:8px auto 14px}
.profile-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:12px}
.profile-actions button{min-width:100px}
.profile-readonly{background:#eee8dc;border-radius:9px;padding:12px;margin:6px 0 14px;font-size:14px;overflow-wrap:anywhere}
.avatar-choices{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.avatar-choice{width:54px;height:54px;border:1px solid var(--line);border-radius:50%;background:var(--surface2);font-size:27px}
.avatar-choice.selected{outline:3px solid var(--green2)}

.settings-row{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.settings-row:last-child{border-bottom:0}
.setting-control{display:flex;gap:10px;align-items:flex-start;margin:13px 0;color:#3b4038;font-size:13px;line-height:1.4}
.setting-control input{width:auto;margin:2px 0 0;accent-color:var(--green2)}
.settings-note{font-size:12px;line-height:1.45;color:#74766f;margin:8px 0 0}
.finance-lock{border:1px solid #d9d0c1;background:#f7f1e5;border-radius:12px;padding:14px;margin:13px 0}
.finance-lock p{font-size:13px;color:#65695f;line-height:1.45;margin-bottom:0}
.year-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.year-month{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 6px;color:#30352d}
.year-month strong{display:block;text-align:center;margin-bottom:6px;font-size:12px}
.year-days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:9px}
.year-days span{padding:3px 0}
.notification-card{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start}
.notification-emoji{font-size:22px}
.notification-title{font-size:14px;font-weight:700;margin-bottom:4px}
.notification-description{font-size:12px;color:#65695f;line-height:1.4}
.notification-meta{font-size:10px;color:#777;text-align:right}
@media(min-width:440px){.year-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:550px){main{padding:25px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div>
  <div class="brand">Enorden</div>
  <div class="slogan">Tu hogar, organizado en un solo lugar</div>
 </div>
 <div class="header-actions">
  <button class="icon-btn" onclick="toggleHeaderPanel('notificaciones')" aria-label="Notificaciones">
   <svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
  </button>
  <button class="icon-btn" onclick="toggleHeaderPanel('configuracion')" aria-label="Configuración">
   <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.5-2-3.4-2.4 1a7.8 7.8 0 0 0-1.7-1L15 3.5H9l-.4 2.6a7.8 7.8 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5a7.8 7.8 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7.8 7.8 0 0 0 1.7 1L9 21h6l.4-2.6a7.8 7.8 0 0 0 1.7-1l2.4 1 2-3.4z"/>
    <circle cx="12" cy="12" r="3.2"/>
   </svg>
  </button>
 </div>
</header>
<main id="screen"></main>
<nav class="bottom-nav hidden" id="bottomNav"></nav>
<button class="fab hidden" id="fab" onclick="openAdd()">+</button>
</div>

<div class="modal-backdrop" id="backdrop" onclick="if(event.target===this)closeModal()">
 <div class="modal">
  <div class="close-row"><h2 id="modalTitle">Agregar</h2>
   <button class="small-btn" onclick="closeModal()">Cancelar ✕</button>
  </div>
  <div id="modalBody"></div>
 </div>
</div>

<script>
const modules=[
 {id:'calendario',name:'Calendario',emoji:'📅'},
 {id:'tareas',name:'Tareas',emoji:'✓'},
 {id:'listas',name:'Listas',emoji:'🛒'},
 {id:'finanzas',name:'Finanzas',emoji:'💰'},
 {id:'rutinas',name:'Rutinas',emoji:'🔄'},
 {id:'notas',name:'Notas',emoji:'📝'},
 {id:'mapa',name:'Mapa',emoji:'📍'},
 {id:'chat',name:'Chat',emoji:'💬'}
];
let order=JSON.parse(localStorage.getItem('enorden_order')||'null');
if(!Array.isArray(order)||order.length!==modules.length)order=modules.map(m=>m.id);
let current='inicio',calendarView='Mes',selectedDate=new Date();
let headerPanelReturn='inicio';
let tasks=JSON.parse(localStorage.getItem('enorden_tasks')||'[]');
let products=JSON.parse(localStorage.getItem('enorden_products')||'[]');
let events=JSON.parse(localStorage.getItem('enorden_events')||'[]');
let householdDevice=localStorage.getItem('enorden_household_device')==='true';
let financeLockChoice=localStorage.getItem('enorden_finance_lock')||'unset';
let financeLockMinutes=Number(localStorage.getItem('enorden_finance_lock_minutes')||5);
let adminFinanceRule=localStorage.getItem('enorden_finance_admin_rule')==='true';
let financePinHash=localStorage.getItem('enorden_finance_pin_hash')||'';
let financeUnlockUntil=Number(localStorage.getItem('enorden_finance_unlock_until')||0);
let householdRole=localStorage.getItem('enorden_household_role')||'admin';
let householdMemberCount=Number(localStorage.getItem('enorden_household_member_count')||1);
let homeCode=localStorage.getItem('enorden_home_code');
if(!homeCode){homeCode='EN-'+Math.random().toString(36).slice(2,8).toUpperCase();localStorage.setItem('enorden_home_code',homeCode)}
let notifications=JSON.parse(localStorage.getItem('enorden_notifications')||'[]');
let notificationsOpened=localStorage.getItem('enorden_notifications_opened')==='true';
let chats=JSON.parse(localStorage.getItem('enorden_chats')||'null');
if(!Array.isArray(chats)){chats=[{id:'familia',name:'Familia',createdAt:Date.now(),retentionHours:168,type:'family'}];localStorage.setItem('enorden_chats',JSON.stringify(chats))}
let financeSetupContext='settings';
const screen=document.getElementById('screen');
const nav=document.getElementById('bottomNav');
const fab=document.getElementById('fab');
const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const weekdays=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
function closeModal(){
 document.getElementById('backdrop').classList.remove('show');
}
function save(){
 localStorage.setItem('enorden_tasks',JSON.stringify(tasks));
 localStorage.setItem('enorden_products',JSON.stringify(products));
 localStorage.setItem('enorden_events',JSON.stringify(events));
 localStorage.setItem('enorden_order',JSON.stringify(order));
}
function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function orderedModules(){return order.map(id=>modules.find(m=>m.id===id)).filter(Boolean)}
function toggleHeaderPanel(id){
 if(current===id){
  const back=headerPanelReturn||'inicio';
  current=back;render();window.scrollTo(0,0);return;
 }
 if(current!=='notificaciones'&&current!=='configuracion')headerPanelReturn=current;
 if(current==='finanzas'&&id!=='finanzas')startFinanceLockTimer();
 current=id;render();window.scrollTo(0,0);
}
function navigate(id){
 if(current==='finanzas'&&id!=='finanzas')startFinanceLockTimer();
 if(id==='finanzas'&&current!=='finanzas'){requestFinanceAccess();return}
 current=id;render();window.scrollTo(0,0);
}
function renderNav(){
 const homeButton=`<button class="nav-btn ${current==='inicio'?'active':''}" data-home="true" onclick="navigate('inicio')">
 <span class="nav-icon">🏠</span><span class="nav-label">Inicio</span></button>`;
 nav.innerHTML=homeButton+orderedModules().map(m=>`
 <button class="nav-btn ${current===m.id?'active':''}" data-module="${m.id}"
 onclick="navigate('${m.id}')">
 <span class="nav-icon">${m.emoji}</span><span class="nav-label">${m.name}</span>
 </button>`).join('');
 nav.classList.toggle('hidden',current==='inicio');
 fab.classList.toggle('hidden',!['calendario','tareas','listas'].includes(current));
 enableReorder(nav);
}
function render(){
 if(current==='notificaciones'&&notificationsOpened){notifications=notifications.slice(-3);localStorage.setItem('enorden_notifications',JSON.stringify(notifications))}
 renderNav();
 if(current==='inicio')renderHome();
 else if(current==='calendario')renderCalendar();
 else if(current==='tareas')renderTasks();
 else if(current==='listas')renderLists();
 else if(current==='notificaciones')renderNotifications();
 else if(current==='configuracion')renderSettings();
 else if(current==='finanzas')renderFinance();
 else if(current==='chat')renderChat();
 else renderOther(current);
}
function renderHome(){
 const d=new Date();
 const day=d.toLocaleDateString('es-CL',{weekday:'long'});
 const date=d.toLocaleDateString('es-CL',{day:'numeric',month:'long'});
 const pending=tasks.filter(t=>!t.done).length;
 const shopping=products.filter(p=>!p.bought).length;
 const todayKey=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 const upcoming=events.filter(e=>e.date>=todayKey).length;
 screen.innerHTML=`
 <div class="dayline"><strong>${day},</strong><span>${date}</span></div>
 <div class="greeting">Hola Vale 👋</div>
 <div class="weather"><span class="weather-icon">☀️</span><span>22 °C</span></div>
 <p class="summary-intro">Este es tu resumen de hoy.</p>
 <div class="searchbox">
  <input id="homeSearch" placeholder="Buscar en tu hogar...">
  <button onclick="voiceSearch()" aria-label="Buscar por voz">🎙</button>
  <button onclick="doSearch()" aria-label="Buscar">⌕</button>
 </div>
 <div class="summary-grid">
  <button class="summary-card" onclick="navigate('tareas')">
   <div class="number">${pending}</div><div class="label">Tareas pendientes</div>
  </button>
  <button class="summary-card" onclick="navigate('calendario')">
   <div class="number">${upcoming}</div><div class="label">Eventos pendientes</div>
  </button>
  <button class="summary-card" onclick="navigate('listas')">
   <div class="number">${shopping}</div><div class="label">Compras pendientes</div>
  </button>
 </div>
 <section class="section">
  <div class="section-title">Mis módulos</div>
  <div class="module-strip" id="homeModules">

/* Reordenamiento común para Inicio y navegación inferior */
function enableReorder(container){
 if(!container)return;
 let timer=null,source=null,active=false;
 container.querySelectorAll('[data-module]').forEach(el=>{
  el.addEventListener('pointerdown',()=>{
   source=el;active=false;
   timer=setTimeout(()=>{active=true;el.style.opacity='.55'},500);
  });
  el.addEventListener('pointermove',e=>{
   if(!active||!source)return;
   const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-module]');
   if(target&&target!==source&&target.parentElement===container){
    const a=[...container.children].indexOf(source);
    const b=[...container.children].indexOf(target);
    if(a<b)container.insertBefore(source,target.nextSibling);
    else container.insertBefore(source,target);
   }
  });
  ['pointerup','pointercancel','pointerleave'].forEach(evt=>el.addEventListener(evt,()=>{
   clearTimeout(timer);
   if(active){
    const newOrder=[...container.querySelectorAll('[data-module]')].map(x=>x.dataset.module);
    order=newOrder;save();render();
   }
   if(source)source.style.opacity='';
   active=false;source=null;
  }));
 });
}

 <label for="whatsappNumber">WhatsApp de verificación</label><input id="whatsappNumber" type="tel" value="${escapeHTML(whatsapp)}" placeholder="+56 9 1234 5678"><button class="secondary-btn" onclick="verifyWhatsapp()">Verificar WhatsApp</button>
 <p class="settings-note" id="whatsappStatus">${localStorage.getItem('enorden_whatsapp_verified')==='true'?'WhatsApp verificado.':'Debes verificar el número para agregarlo.'}</p>
 <div class="profile-actions"><button class="secondary-btn" onclick="closeModal()">Cerrar</button></div><p class="settings-note">En este prototipo la verificación es una demostración: todavía no se envían correos ni mensajes reales.</p>`;
 document.getElementById('backdrop').classList.add('show');
}
function verifyAlternateEmail(){
 const email=document.getElementById('alternateEmail').value.trim();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert('Ingresa un correo con formato válido.');return}
 const code=String(Math.floor(100000+Math.random()*900000));alert('Demostración: tu código sería '+code+'. En la versión completa llegará a tu correo.');
 if(prompt('Ingresa el código de demostración:')===code){localStorage.setItem('enorden_alternate_email',email);localStorage.setItem('enorden_alternate_verified','true');document.getElementById('alternateStatus').textContent='Correo alternativo verificado y guardado.';}else alert('El código no coincide. No se guardó el correo.');
}
function verifyWhatsapp(){
 const number=document.getElementById('whatsappNumber').value.trim();
 if(!/^\+?[0-9 ()-]{8,20}$/.test(number)){alert('Ingresa un número válido con código de país.');return}
 const code=String(Math.floor(100000+Math.random()*900000));alert('Demostración: tu código sería '+code+'. En la versión completa llegará por WhatsApp.');
 if(prompt('Ingresa el código de demostración:')===code){localStorage.setItem('enorden_whatsapp',number);localStorage.setItem('enorden_whatsapp_verified','true');document.getElementById('whatsappStatus').textContent='WhatsApp verificado y guardado.';}else alert('El código no coincide. No se guardó el número.');
}

function startFinanceLockTimer(){
 if(householdDevice||adminFinanceRule){financeUnlockUntil=0}
 else if(financeLockChoice==='on'){financeUnlockUntil=Date.now()+Math.max(0,financeLockMinutes)*60000}
 localStorage.setItem('enorden_finance_unlock_until',String(financeUnlockUntil));
}
function enterFinance(){
 closeModal();financeUnlockUntil=0;localStorage.setItem('enorden_finance_unlock_until','0');
 current='finanzas';render();window.scrollTo(0,0);
}
function requestFinanceAccess(){
 const mustAlways=householdDevice||adminFinanceRule;
 if(!mustAlways&&financeLockChoice==='unset'){
  document.getElementById('modalTitle').textContent='Seguridad de Finanzas';
  document.getElementById('modalBody').innerHTML=`
   <p>¿Quieres activar un bloqueo para entrar al módulo Finanzas?</p>
   <label>¿Cada cuánto tiempo quieres que se bloquee?</label>
   <select id="firstFinanceTimeout">
    <option value="0">Inmediatamente al salir</option><option value="1">1 minuto</option>
    <option value="5" selected>5 minutos</option><option value="15">15 minutos</option><option value="30">30 minutos</option>
   </select>
   <div class="toolbar"><button class="secondary-btn" onclick="chooseFinanceSecurity(false)">Ahora no</button>
   <button class="primary-btn" onclick="chooseFinanceSecurity(true)">Activar seguridad</button></div>`;
  document.getElementById('backdrop').classList.add('show');return;
 }
 if(!mustAlways&&financeLockChoice==='off'){enterFinance();return}
 if(!mustAlways&&financeLockChoice==='on'&&Date.now()<financeUnlockUntil){enterFinance();return}
 if(!financePinHash){showFinancePinSetup(true);return}
 document.getElementById('modalTitle').textContent='Ingresar PIN de Finanzas';
 document.getElementById('modalBody').innerHTML=`
  <label for="financePinEntry">PIN de 4 dígitos</label>
  <input id="financePinEntry" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
  <button class="primary-btn" onclick="verifyFinancePin()">Desbloquear Finanzas</button>`;
 document.getElementById('backdrop').classList.add('show');
}
function chooseFinanceSecurity(enabled){
 const select=document.getElementById('firstFinanceTimeout');
 financeLockMinutes=Number(select?select.value:5);
 localStorage.setItem('enorden_finance_lock_minutes',String(financeLockMinutes));
 financeLockChoice=enabled?'on':'off';localStorage.setItem('enorden_finance_lock',financeLockChoice);
 if(enabled)showFinancePinSetup(true);else enterFinance();
}
function showFinancePinSetup(continueToFinance){
 financeSetupContext=continueToFinance?'finance':'settings';
 document.getElementById('modalTitle').textContent='Configurar PIN de Finanzas';
 document.getElementById('modalBody').innerHTML=`
  <p>Elige un PIN de exactamente 4 números.</p>
  <label for="financePinNew">Nuevo PIN</label><input id="financePinNew" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 dígitos">
  <label for="financePinConfirm">Confirmar PIN</label><input id="financePinConfirm" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Repite el PIN">
  <button class="primary-btn" onclick="saveFinancePin()">Guardar PIN</button>
  <p class="settings-note">En esta versión de prueba el PIN solo demuestra el flujo. No uses una clave real ni lo consideres protección de información sensible.</p>`;
 document.getElementById('backdrop').classList.add('show');
}
async function hashFinancePin(value){
 const bytes=new TextEncoder().encode(value);
 const digest=await crypto.subtle.digest('SHA-256',bytes);
 return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function saveFinancePin(){
 const pin=document.getElementById('financePinNew').value;
 const confirm=document.getElementById('financePinConfirm').value;
 if(!/^\d{4}$/.test(pin)){alert('El PIN debe tener exactamente 4 números.');return}
 if(pin!==confirm){alert('Los PIN no coinciden.');return}
 financePinHash=await hashFinancePin(pin);localStorage.setItem('enorden_finance_pin_hash',financePinHash);
 closeModal();
 if(financeSetupContext==='finance')enterFinance();else renderSettings();
}
async function verifyFinancePin(){
 const pin=document.getElementById('financePinEntry').value;
 if(!/^\d{4}$/.test(pin)){alert('Ingresa un PIN de 4 números.');return}
 const candidate=await hashFinancePin(pin);
 if(candidate!==financePinHash){alert('El PIN no es correcto.');return}
 enterFinance();
}
function saveSecuritySettings(){
 householdDevice=document.getElementById('householdDevice').checked;
 const adminControl=document.getElementById('adminFinanceRule');
 if(householdRole==='admin')adminFinanceRule=adminControl.checked;
 financeLockMinutes=Number(document.getElementById('financeTimeout').value);
 localStorage.setItem('enorden_household_device',String(householdDevice));
 localStorage.setItem('enorden_finance_admin_rule',String(adminFinanceRule));
 localStorage.setItem('enorden_finance_lock_minutes',String(financeLockMinutes));
 alert('Configuración guardada en este dispositivo.');
}
async function copyHomeCode(){

 catch(e){alert('No se pudo copiar automáticamente. Código: '+homeCode)}
}
async function shareHomeCode(){
 if(navigator.share){try{await navigator.share({title:'Código de hogar Enorden',text:'Te invito a solicitar unirte a mi hogar en Enorden. Código: '+homeCode})}catch(e){}}
 else copyHomeCode();
}

function openAdd(){
 if(current==='tareas'){document.getElementById('modalTitle').textContent='Nueva tarea';document.getElementById('modalBody').innerHTML='<label>Nombre de la tarea</label><input id="newValue" placeholder="¿Qué necesitas hacer?"><button class="primary-btn" onclick="addTask()">Guardar tarea</button>'}
 else if(current==='listas'){document.getElementById('modalTitle').textContent='Agregar producto';document.getElementById('modalBody').innerHTML='<label>Producto</label><input id="newValue" placeholder="Nombre del producto"><label>Sección</label><select id="newSection">'+['Despensa','Congelados','Frutas','Verduras','Limpieza','Cocina','Baño','Personales','Extras'].map(x=>'<option>'+x+'</option>').join('')+'</select><button class="primary-btn" onclick="addProduct()">Agregar producto</button>'}
 else{document.getElementById('modalTitle').textContent='Nuevo evento';document.getElementById('modalBody').innerHTML='<p class="event-form-subtitle">¿Qué tipo de evento quieres crear?</p><div class="event-form-section"><select id="eventType" onchange="showEventFields()"><option value="">Selecciona un tipo de evento</option><option value="normal">Evento normal</option><option value="birthday">Cumpleaños</option><option value="anniversary">Aniversario</option></select></div><div id="eventFields"></div>'}

function showEventFields(){
 const type=document.getElementById('eventType').value,w=document.getElementById('eventFields');if(!type){w.innerHTML='';return}
 const preset=calendarView==='Día'?keyDate(selectedDate):'';
 const times=Array.from({length:96},(_,i)=>{const hh=String(Math.floor(i/4)).padStart(2,'0'),mm=String(i%4*15).padStart(2,'0');return '<option value="'+hh+':'+mm+'" '+(hh==='09'&&mm==='00'?'selected':'')+'>'+hh+':'+mm+'</option>'}).join('');
 const taskOptions=tasks.map(t=>'<option value="'+t.id+'">'+escapeHTML(t.title)+'</option>').join('');
 w.innerHTML=
 '<div class="event-form-section"><label>Nombre</label><input id="eventName" placeholder="Nombre del evento" oninput="updateEventPreview()"></div>'+
 '<div class="event-two-col"><div class="event-form-section"><span class="field-label">Fecha</span><input id="eventDate" type="date" value="'+preset+'" onchange="updateEventPreview()"></div><div class="event-form-section" id="eventTimeWrap"><span class="field-label">Hora</span><select id="eventTime" onchange="updateEventPreview()">'+times+'</select></div></div>'+
 '<div class="event-form-section"><label class="event-choice"><input id="eventAllDay" type="checkbox" onchange="toggleEventAllDay()"> Todo el día</label></div>'+
 '<div class="event-form-section"><span class="field-label">¿Dónde se verá?</span><div class="event-choice-row"><label class="event-choice"><input type="radio" name="eventScope" value="personal" checked> Mi calendario personal</label><label class="event-choice"><input type="radio" name="eventScope" value="family"> Calendario familiar</label></div></div>'+
 '<div class="event-form-section"><label>Prioridad</label><select id="eventPriority" onchange="toggleEventColor()"><option value="normal">Normal</option><option value="high">Alta prioridad: destacar el día en el calendario</option></select><div id="eventColorWrap" class="hidden"><label>Selecciona el color</label><input id="eventColor" class="event-color" type="color" value="#d65b4a" onchange="updateEventPreview()"></div></div>'+
 '<div class="event-form-section"><label>Repetición</label><select id="eventRepeat" onchange="toggleCustomDays()"><option value="none">No se repite</option><option value="yearly">Anualmente</option><option value="monthly">Mensualmente</option><option value="daily">Diariamente</option><option value="custom">Personalizado</option></select><div id="eventCustomDays" class="hidden"><span class="field-label">Repetir estos días</span><div class="event-days">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map((x,i)=>'<label><input type="checkbox" name="eventWeekday" value="'+i+'"> '+x+'</label>').join('')+'</div></div></div>'+
 '<div class="event-form-section"><label>Alerta</label><select id="eventAlertState" onchange="toggleEventAlerts()"><option value="off">Desactivar</option><option value="on">Activar</option></select><div id="eventAlertsWrap" class="hidden"><div id="eventAlertRows"></div><button type="button" class="small-btn" onclick="addEventAlert()">+ Agregar otra alerta</button></div></div>'+
 '<div class="event-form-section"><span class="field-label">Conectar con otros módulos</span><label class="event-choice"><input id="linkTask" type="checkbox" onchange="toggleEventLink(\'task\')"> Vincular con una tarea</label><div id="linkTaskWrap" class="hidden"><select id="linkTaskId">'+(taskOptions||'<option value="">No hay tareas guardadas</option>')+'</select></div><label class="event-choice"><input id="linkNote" type="checkbox" onchange="toggleEventLink(\'note\')"> Vincular con una nota</label><div id="linkNoteWrap" class="hidden"><input id="linkNoteId" placeholder="Referencia de la nota (módulo en desarrollo)"></div><label class="event-choice"><input id="linkExpense" type="checkbox" onchange="toggleEventLink(\'expense\')"> Vincular con un gasto o presupuesto</label><div id="linkExpenseWrap" class="hidden"><input id="linkExpenseId" placeholder="Referencia del gasto o presupuesto (módulo en desarrollo)"></div></div>'+
 '<div class="event-preview"><div class="field-label">Vista previa</div><div id="eventPreview"><div class="event-preview-title">Nombre del evento</div>Selecciona una fecha</div></div>'+
 '<div class="event-form-actions"><button class="secondary-btn" onclick="closeModal()">Cancelar</button><button class="primary-btn" onclick="addEvent()">Guardar</button></div>';
 if(type==='birthday'||type==='anniversary')document.getElementById('eventRepeat').value='yearly';
 if(type==='birthday'||type==='anniversary'){
  document.getElementById('eventAllDay').checked=true;
  document.getElementById('eventAllDay').disabled=true;
  document.getElementById('eventRepeat').disabled=true;
  toggleEventAllDay();
 }
 if(type==='anniversary'){
  document.getElementById('eventPriority').value='high';
  document.getElementById('eventColor').value='#e88ab8';
  document.getElementById('eventColorWrap').classList.remove('hidden');
 }
 updateEventPreview();
}
function toggleEventAllDay(){const v=document.getElementById('eventAllDay').checked;document.getElementById('eventTimeWrap').classList.toggle('hidden',v);updateEventPreview()}
function toggleEventColor(){document.getElementById('eventColorWrap').classList.toggle('hidden',document.getElementById('eventPriority').value!=='high');updateEventPreview()}
function toggleCustomDays(){document.getElementById('eventCustomDays').classList.toggle('hidden',document.getElementById('eventRepeat').value!=='custom')}
function toggleEventAlerts(){const on=document.getElementById('eventAlertState').value==='on';document.getElementById('eventAlertsWrap').classList.toggle('hidden',!on);if(on&&!document.getElementById('eventAlertRows').children.length)addEventAlert()}
function addEventAlert(){const r=document.createElement('div');r.className='event-alert-row';r.innerHTML='<input type="number" min="1" value="15" aria-label="Cantidad"><select><option value="minutes">Minutos</option><option value="hours">Horas</option><option value="days">Días</option></select><button type="button" class="small-btn" onclick="this.parentElement.remove()">×</button>';document.getElementById('eventAlertRows').appendChild(r)}
function toggleEventLink(k){const id='link'+k[0].toUpperCase()+k.slice(1);document.getElementById(id+'Wrap').classList.toggle('hidden',!document.getElementById(id).checked)}
function updateEventPreview(){const p=document.getElementById('eventPreview');if(!p)return;const n=document.getElementById('eventName').value.trim()||'Nombre del evento',d=document.getElementById('eventDate').value,all=document.getElementById('eventAllDay').checked,t=document.getElementById('eventTime').value,high=document.getElementById('eventPriority').value==='high',c=document.getElementById('eventColor').value;const dt=d?new Date(d+'T12:00:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Fecha por seleccionar';p.innerHTML='<div class="event-preview-title">'+escapeHTML(n)+'</div><div>'+escapeHTML(dt)+(all?' · Todo el día':t?' · '+t:'')+'</div><div>'+(high?'<span style="color:'+c+'">● Alta prioridad</span>':'Prioridad normal')+'</div>';p.style.borderLeft=high?'5px solid '+c:'1px solid var(--line)'}
function collectEventAlerts(){if(document.getElementById('eventAlertState').value!=='on')return [];return [...document.querySelectorAll('#eventAlertRows .event-alert-row')].map(r=>({amount:Number(r.querySelector('input').value)||0,unit:r.querySelector('select').value})).filter(a=>a.amount>0)}
function normalizedEventName(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function similarEventName(a,b){const x=normalizedEventName(a),y=normalizedEventName(b);if(!x||!y)return false;if(x===y)return true;const ax=new Set(x.split(' ').filter(w=>w.length>2)),by=new Set(y.split(' ').filter(w=>w.length>2));if(!ax.size||!by.size)return false;const shared=[...ax].filter(w=>by.has(w)).length;return shared/Math.min(ax.size,by.size)>=0.6}
function eventOccursOn(ev,date){const base=new Date((ev.date||'')+'T12:00:00'),target=new Date(date.getFullYear(),date.getMonth(),date.getDate());if(!ev.date||isNaN(base.getTime())||target<new Date(base.getFullYear(),base.getMonth(),base.getDate()))return false;const diff=Math.round((target-new Date(base.getFullYear(),base.getMonth(),base.getDate()))/86400000);if(!ev.repeat||ev.repeat==='none')return diff===0;if(ev.repeat==='daily')return true;if(ev.repeat==='monthly')return target.getDate()===base.getDate();if(ev.repeat==='yearly')return target.getMonth()===base.getMonth()&&target.getDate()===base.getDate();if(ev.repeat==='custom')return Array.isArray(ev.weekdays)&&ev.weekdays.includes((target.getDay()+6)%7);return diff===0}
function addEvent(){
 const name=document.getElementById('eventName')?.value.trim(),date=document.getElementById('eventDate')?.value,type=document.getElementById('eventType')?.value;
 if(!type){alert('Selecciona el tipo de evento.');return}if(!name){alert('Escribe el nombre del evento.');return}if(!date){alert('Selecciona una fecha.');return}
 const repeat=document.getElementById('eventRepeat').value,days=[...document.querySelectorAll('input[name="eventWeekday"]:checked')].map(x=>Number(x.value));if(repeat==='custom'&&!days.length){alert('Selecciona al menos un día de la semana.');return}
 const allDay=document.getElementById('eventAllDay').checked,scope=document.querySelector('input[name="eventScope"]:checked')?.value||'personal',priority=document.getElementById('eventPriority').value,alerts=collectEventAlerts(),links=[];
 if(document.getElementById('linkTask').checked){const id=document.getElementById('linkTaskId')?.value;if(id)links.push({type:'task',id:Number(id)})}
 if(document.getElementById('linkNote').checked){const id=document.getElementById('linkNoteId').value.trim();if(id)links.push({type:'note',id})}
 if(document.getElementById('linkExpense').checked){const id=document.getElementById('linkExpenseId').value.trim();if(id)links.push({type:'expense',id})}
 const dup=events.find(e=>e.date===date&&similarEventName(e.title,name));if(dup&&!confirm('Ya existe un evento similar en esa fecha ('+dup.title+'). ¿Quieres crearlo de todas formas?'))return;
 const id=Date.now();events.push({id,seriesId:'series-'+id,title:name,type,date,time:allDay?null:document.getElementById('eventTime').value,allDay,scope,priority,color:priority==='high'?document.getElementById('eventColor').value:null,repeat,weekdays:repeat==='custom'?days:[],alerts,links,createdAt:new Date().toISOString()});save();closeModal();render();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&current==='finanzas')startFinanceLockTimer()});
window.addEventListener('pagehide',()=>{if(current==='finanzas')startFinanceLockTimer()});
render();
</script>
