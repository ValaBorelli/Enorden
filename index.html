
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Enorden</title>
<style>
:root{
 --bg:#f2ecdf;--surface:#fffaf1;--surface2:#e9e0d0;
 --green:#24564f;--green2:#326b61;--white:#242820;
 --muted:#70736c;--line:#d9d0c1;--gold:#bd9144;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#242820;
 font-family:Arial,Helvetica,sans-serif;font-size:15px}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:650px;margin:auto;min-height:100vh}
header{height:76px;background:var(--green);padding:12px 17px;
 display:flex;align-items:center;justify-content:space-between;
 position:sticky;top:0;z-index:10}
.brand{font-size:25px;font-weight:700;color:#fff}
.slogan{font-size:11px;color:#dce8e3;margin-top:3px}
.header-actions{display:flex;gap:10px}
.icon-btn{width:39px;height:39px;border:0;border-radius:50%;
 background:#ffffff18;color:white;display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;
 fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.icon-btn:active{background:#ffffff22}
.settings-accordion{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.settings-accordion summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;cursor:pointer;font-weight:700;color:#30352d}
.settings-accordion summary::-webkit-details-marker{display:none}
.settings-accordion > summary::after{content:'⌄';font-size:20px;color:#687066;transition:transform .18s}
.settings-accordion[open] > summary::after{transform:rotate(180deg)}
.accordion-content{padding:0 16px 16px;border-top:1px solid var(--line)}
.accordion-content .settings-row:first-child{margin-top:4px}
main{padding:21px 17px 35px}
h1,h2,h3,p{margin-top:0}
h1{font-size:25px;margin-bottom:8px}
h2{font-size:18px;margin-bottom:13px}
.muted{color:var(--muted)}
.dayline{display:flex;align-items:baseline;gap:8px;margin:3px 0 15px}
.dayline strong{font-size:19px;color:#242820;text-transform:capitalize}
.dayline span{font-size:15px;color:#74766f}
.greeting{font-size:29px;font-weight:700;margin:0 0 9px}
.weather{display:flex;align-items:center;gap:8px;font-size:16px;
 color:#555a51;margin-bottom:10px}
.weather-icon{font-size:20px}
.summary-intro{font-size:13px;color:var(--muted);margin-bottom:17px}
.searchbox{display:flex;align-items:center;gap:8px;
 background:var(--surface);border:1px solid var(--line);
 border-radius:13px;padding:4px 7px;margin-bottom:20px}
.searchbox input{flex:1;min-width:0;background:transparent;
 color:#242820;border:0;outline:none;padding:11px 7px}
.searchbox button{border:0;border-radius:9px;background:var(--green);
 color:white;padding:9px 11px}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.summary-card{background:var(--surface);border:1px solid var(--line);
 border-radius:13px;padding:13px 9px;min-height:94px;color:#242820;text-align:left}
.summary-card .number{font-size:25px;font-weight:700;margin-bottom:5px}
.summary-card .label{font-size:11px;color:#70736c;line-height:1.3}
.section{margin-top:27px}
.section-title{font-size:18px;font-weight:700;margin-bottom:13px}
.module-strip,.bottom-nav{display:flex;gap:9px;overflow-x:auto;
 scrollbar-width:thin;scrollbar-color:#555 transparent;
 -webkit-overflow-scrolling:touch}
.module-strip{padding:2px 1px 12px;scroll-snap-type:x proximity}
.module-tile{flex:0 0 88px;min-height:88px;scroll-snap-align:start;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:8px;background:var(--surface);border:1px solid var(--line);
 color:#242820;border-radius:14px;padding:10px 5px;touch-action:pan-x}
.module-tile .emoji{font-size:24px}
.module-tile span:last-child{font-size:11px;text-align:center}
.hint{font-size:11px;line-height:1.5;color:#999;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);
 border-radius:14px;padding:15px;margin-bottom:11px;color:#242820}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.page-heading{margin-bottom:18px}
.page-heading p{font-size:13px;color:var(--muted);margin:5px 0 0}
.toolbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.small-btn,.primary-btn,.secondary-btn{border:0;border-radius:9px;padding:10px 13px}
.small-btn{background:var(--surface2);color:#30352d;white-space:nowrap}
.small-btn.active,.primary-btn{background:var(--green2);color:white}
.secondary-btn{background:var(--surface2);color:#30352d}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
 gap:5px;text-align:center}
.calendar-grid div{padding:10px 1px;border-radius:8px;font-size:12px;color:#30352d}
.calendar-grid .weekday{color:#70736c;font-weight:700}
.calendar-grid .today{background:var(--green2);color:white}
/* Los eventos normales se indican solo con un punto, sin borde. */
.calendar-grid .calendar-day{position:relative;cursor:pointer;border:1px solid transparent}
.calendar-grid .calendar-day.has-event::before,.year-days .calendar-day.has-event::before{content:'';position:absolute;top:4px;left:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.calendar-grid .calendar-day.high-priority,.year-days .calendar-day.high-priority{outline:2px solid var(--event-border);outline-offset:-2px}
.year-days .calendar-day{position:relative;cursor:pointer;border-radius:50%}
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.month-tile{padding:15px 4px;background:var(--surface2);color:white;
 border:1px solid var(--line);border-radius:10px}
.task-row,.setting-row{display:flex;align-items:center;gap:10px;
 padding:12px 0;border-bottom:1px solid var(--line)}
.task-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--green2)}
.task-row .task-name{flex:1}
.done{text-decoration:line-through;color:var(--muted)}
.list-section h3{font-size:14px;color:#444a40;margin:0 0 9px}
.empty{text-align:center;color:var(--muted);padding:20px 8px}
.pill{font-size:11px;background:#e0ebe3;color:#24564f;
 padding:5px 9px;border-radius:20px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(650px,100%);background:#fffaf1;border-top:1px solid #d9d0c1;
 padding:9px 7px max(10px,env(safe-area-inset-bottom));
 z-index:15;gap:5px;scrollbar-width:none;justify-content:flex-start}
.bottom-nav::-webkit-scrollbar{display:none}
.nav-btn{flex:0 0 76px;min-width:76px;border:0;background:transparent;
 color:#72756d;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:5px;padding:5px 2px;border-radius:10px;
 touch-action:pan-x}
.nav-btn.active{color:#fff;background:#2c4842}
.nav-icon{font-size:20px;line-height:23px}
.nav-label{font-size:10px;white-space:nowrap}
.hidden{display:none!important}
.fab{position:fixed;bottom:83px;right:max(20px,calc((100vw - 610px)/2));
 width:52px;height:52px;border:0;border-radius:50%;
 background:var(--green2);color:white;font-size:29px;z-index:12}
.modal-backdrop{position:fixed;inset:0;background:#0008;z-index:30;
 display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.show{display:flex}
.modal{background:#fffaf1;color:#242820;width:min(650px,100%);padding:22px;
 border-radius:20px;max-height:85vh;overflow:auto}
.modal input,.modal select{width:100%;background:#fff;color:#242820;
 border:1px solid #d1c8b8;border-radius:9px;padding:12px;margin:6px 0 13px}
.modal label{font-size:12px;color:#60645c}
.close-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start}
.modal h2{margin:0 0 18px}
.close-row{margin-bottom:12px;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px}.modal-heading{min-width:0}.close-row h2{margin:0;min-width:0;overflow-wrap:anywhere}.close-row .small-btn{justify-self:end;align-self:start;white-space:nowrap;margin:0}.event-form-subtitle{font-size:14px;line-height:1.45;color:#62675e;margin:5px 0 0;overflow-wrap:anywhere}.event-form-section{margin:15px 0}.event-form-section>label:not(.event-choice),.event-form-section>.field-label{display:block;font-size:13px;font-weight:700;color:#42483f;margin:0 0 6px}.event-form-section input:not([type=checkbox]):not([type=color]),.event-form-section select{width:100%;background:#fff;color:#242820;border:1px solid #d1c8b8;border-radius:9px;padding:11px;margin:5px 0 8px}.event-form-section input[type=checkbox],.event-form-section input[type=radio]{accent-color:var(--green2);width:17px;height:17px}.event-two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.event-choice-row{display:flex;gap:8px;flex-wrap:wrap}.event-choice{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:12px;margin:5px 0}.event-alert-row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:center}.event-preview{background:#f4efe5;border:1px solid var(--line);border-radius:12px;padding:13px;margin:16px 0}.event-preview-heading{text-align:center}.event-preview-content{display:grid;gap:5px;text-align:left;line-height:1.4;padding:3px 6px 3px 10px;box-sizing:border-box;min-width:0}.event-preview-title{font-weight:700;font-size:15px;margin-bottom:2px}.event-preview-row{overflow-wrap:anywhere}.event-form-actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.event-form-actions button{min-width:112px}.event-color{width:100%;height:40px;padding:3px!important}.event-days{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.event-days label{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px}
.event-form-section{min-width:0}
.event-detail-card{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:100%;min-width:0;margin:0 auto 16px}
.event-detail-title{text-align:center;font-size:18px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;margin:0 0 13px}
.event-detail-list{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;min-width:0}
.event-detail-row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px;align-items:start;font-size:13px;line-height:1.4;min-width:0}
.event-detail-label{font-weight:700;color:var(--muted)}
.event-detail-value{overflow-wrap:anywhere;min-width:0}
.event-detail-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}
.event-detail-actions button{min-width:0;padding:12px 7px;white-space:normal}
.countdown-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.countdown-number{font-size:25px;font-weight:700;color:var(--accent);margin:5px 0}
.countdown-caption{font-size:12px;color:var(--muted)}
.event-choice{display:flex;align-items:center;flex-wrap:wrap;max-width:100%;white-space:normal;line-height:1.4}
.event-choice input[type=checkbox],.event-choice input[type=radio]{flex:0 0 17px;width:17px;min-width:17px;margin:0}
.event-two-col{grid-template-columns:repeat(2,minmax(0,1fr));min-width:0}
.event-two-col>div{min-width:0}
.event-alert-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.event-form-actions button{flex:1;min-width:0;white-space:normal;line-height:1.25;padding:12px 8px}
.event-form-section input,.event-form-section select{min-width:0;max-width:100%}

.bottom-space{height:75px}
.plain-heading{font-size:16px;font-weight:700;margin:23px 0 8px;color:#242820}
.home-code{font-size:25px;font-weight:800;letter-spacing:2px;color:#39ed63;
 background:#1c3225;border-radius:12px;padding:15px;text-align:center;overflow-wrap:anywhere}
.settings-action{width:100%;text-align:left;background:var(--surface);color:#242820;
 border:1px solid var(--line);border-radius:12px;padding:14px;margin:6px 0}
.settings-action.danger{color:#a13b35;border-color:#dfbdb5}
.home-code-actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.home-code-actions button{min-width:112px}
.help-group{margin:10px 0}
.help-group summary{font-weight:700;cursor:pointer;padding:12px 0;color:#30352d;list-style:none;display:flex;align-items:center;gap:12px}
.help-group > summary::-webkit-details-marker{display:none}
.help-group > summary::marker{content:''}
.help-group > summary{list-style:none}
.help-group > summary::after{content:none!important;display:none!important}
.help-main-group > summary{justify-content:space-between}
.help-main-group > summary::after{content:'⌄';font-size:20px;color:#687066;transition:transform .18s;flex:0 0 auto}
.help-main-group[open] > summary::after{transform:rotate(180deg)}
.help-answer{font-size:13px;line-height:1.55;color:#555b52;padding:0 0 12px}
.profile-option{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 2px;color:#30352d}
.profile-option:last-child{border-bottom:0}
.profile-avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--surface2);display:grid;place-items:center;font-size:36px;margin:8px auto 14px}
.profile-avatar-trigger{display:block;padding:0;margin:0 auto;border:0;background:transparent;border-radius:50%;cursor:pointer}.profile-avatar-trigger:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.profile-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:12px}
.profile-actions button{min-width:100px}
.profile-readonly{background:#eee8dc;border-radius:9px;padding:12px;margin:6px 0 14px;font-size:14px;overflow-wrap:anywhere}
.avatar-choices{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.avatar-choice{width:54px;height:54px;border:1px solid var(--line);border-radius:50%;background:var(--surface2);font-size:27px}
.avatar-choice.selected{outline:3px solid var(--green2)}

.settings-row{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.settings-row:last-child{border-bottom:0}
.setting-control{display:flex;gap:10px;align-items:flex-start;margin:13px 0;color:#3b4038;font-size:13px;line-height:1.4}
.setting-control input{width:auto;margin:2px 0 0;accent-color:var(--green2)}
.settings-note{font-size:12px;line-height:1.45;color:#74766f;margin:8px 0 0}
.finance-lock{border:1px solid #d9d0c1;background:#f7f1e5;border-radius:12px;padding:14px;margin:13px 0}
.finance-lock p{font-size:13px;color:#65695f;line-height:1.45;margin-bottom:0}
.year-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.year-month{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 6px;color:#30352d}
.year-month strong{display:block;text-align:center;margin-bottom:6px;font-size:12px}
.year-days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:9px}
.year-days span{padding:3px 0}
.notification-card{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start}
.notification-emoji{font-size:22px}
.notification-title{font-size:14px;font-weight:700;margin-bottom:4px}
.notification-description{font-size:12px;color:#65695f;line-height:1.4}
.notification-meta{font-size:10px;color:#777;text-align:right}
@media(min-width:440px){.year-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:550px){main{padding:25px}}

/* Temas de apariencia: conservan tipografía, tamaños, formas y distribución */
:root{--text:#292D29;--header-foreground:#FFFFFF;--header-muted:#DDE6DF;--surface-alt:#FFFFFF;--surface-warm:#FFFFFF;--nav-bg:#FFFFFF;--nav-text:#777970;--accent:#344E40}
body[data-theme="natural"]{--bg:#EDE8DA;--surface:#FFFFFF;--surface2:#E7E1D4;--green:#344E40;--green2:#344E40;--text:#292D29;--muted:#777970;--line:#D8D2C5;--gold:#A98750;--accent:#344E40;--surface-alt:#FFFFFF;--surface-warm:#FFFFFF;--nav-bg:#FFFFFF;--nav-text:#777970;--header-foreground:#FFFFFF;--header-muted:#DDE6DF}
body[data-theme="night"]{--bg:#151817;--surface:#252B28;--surface2:#303A35;--green:#263D32;--green2:#263D32;--text:#F1F2EF;--muted:#AEB9B1;--line:#3B4540;--gold:#A8D0B1;--accent:#A8D0B1;--surface-alt:#252B28;--surface-warm:#252B28;--nav-bg:#252B28;--nav-text:#AEB9B1;--header-foreground:#F1F2EF;--header-muted:#D1DED5}
body[data-theme="colorful"]{--bg:#FFF5E8;--surface:#D9EFF9;--surface2:#FCE0E7;--green:#7656B8;--green2:#7656B8;--text:#493A70;--muted:#806F99;--line:#E5D6E8;--gold:#F28B78;--accent:#F28B78;--surface-alt:#FCE0E7;--surface-warm:#FFF0B8;--nav-bg:#FFF5E8;--nav-text:#806F99;--header-foreground:#FFFFFF;--header-muted:#EEE7FA}
body[data-theme="executive"]{--bg:#EDF0F3;--surface:#FFFFFF;--surface2:#E1E6EC;--green:#24364B;--green2:#24364B;--text:#303A46;--muted:#657386;--line:#D1D9E2;--gold:#A98750;--accent:#A98750;--surface-alt:#FFFFFF;--surface-warm:#FFFFFF;--nav-bg:#FFFFFF;--nav-text:#657386;--header-foreground:#FFFFFF;--header-muted:#DCE3EA}
body{background:var(--bg);color:var(--text)}.app{color:var(--text)}header{background:var(--green)}.brand{color:var(--header-foreground)}.slogan{color:var(--header-muted)}
.settings-accordion,.card{background:var(--surface);border-color:var(--line);color:var(--text)}.settings-accordion summary,.settings-action,.profile-option,.plain-heading{color:var(--text)}.settings-accordion>summary::after{color:var(--muted)}.accordion-content{border-color:var(--line)}
.dayline strong,.module-tile,.summary-card,.searchbox input{color:var(--text)}.dayline span,.weather,.summary-intro,.muted,.summary-card .label,.hint{color:var(--muted)}.searchbox{background:var(--surface);border-color:var(--line)}.searchbox button,.primary-btn,.small-btn.active{background:var(--green2);color:var(--header-foreground)}
.summary-card,.module-tile{background:var(--surface);border-color:var(--line)}
body[data-theme="colorful"] .summary-card:nth-child(1),body[data-theme="colorful"] .module-tile:nth-child(3n+1){background:#D9EFF9}
body[data-theme="colorful"] .summary-card:nth-child(2),body[data-theme="colorful"] .module-tile:nth-child(3n+2){background:#FCE0E7}
body[data-theme="colorful"] .summary-card:nth-child(3),body[data-theme="colorful"] .module-tile:nth-child(3n){background:#FFF0B8}
.small-btn,.secondary-btn{background:var(--surface2);color:var(--text)}.calendar-grid div{color:var(--text)}.calendar-grid .weekday{color:var(--muted)}.calendar-grid .today{background:var(--green2);color:var(--header-foreground)}
.month-tile,.year-month{background:var(--surface2);border-color:var(--line);color:var(--text)}.task-row,.setting-row{border-color:var(--line)}.done{color:var(--muted)}.list-section h3{color:var(--text)}.pill{background:var(--surface2);color:var(--text)}
.bottom-nav{background:var(--nav-bg);border-color:var(--line)}.nav-btn{color:var(--nav-text)}.nav-btn.active{color:var(--header-foreground);background:var(--green2)}.fab{background:var(--green2);color:var(--header-foreground)}
.modal{background:var(--surface);color:var(--text)}.modal input,.modal select,#appLanguage{background:var(--surface);color:var(--text);border-color:var(--line)}.close-row .small-btn{background:var(--surface2);color:var(--text)}.event-form-subtitle{color:var(--muted)}
.event-form-section>label:not(.event-choice),.event-form-section>.field-label,.event-form-section label{color:var(--text)}.event-form-section input:not([type=checkbox]):not([type=color]),.event-form-section select{background:var(--surface);color:var(--text);border-color:var(--line)}.event-choice,.event-days label{background:var(--surface);color:var(--text);border-color:var(--line)}.event-preview{background:var(--surface2);border-color:var(--line);color:var(--text)}
.settings-action{background:var(--surface);border-color:var(--line)}.profile-option{border-color:var(--line)}.profile-readonly,.finance-lock{background:var(--surface2);border-color:var(--line);color:var(--text)}.avatar-choice{background:var(--surface2);border-color:var(--line)}
.setting-control,.settings-note,.help-answer,.notification-description,.finance-lock p,.notification-meta{color:var(--muted)}
.appearance-launcher{display:flex;align-items:center;gap:9px}.appearance-launcher .appearance-launch-label{flex:1}.appearance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.appearance-choice{min-width:0;text-align:left;padding:8px;border:2px solid var(--line);border-radius:15px;background:var(--surface);color:var(--text)}.appearance-choice[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.appearance-mini{overflow:hidden;border-radius:9px;background:var(--mini-bg);border:1px solid color-mix(in srgb,var(--mini-text) 12%,transparent);color:var(--mini-text)}
.appearance-mini-header{height:19px;background:var(--mini-header);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 7px;font-size:7px;font-weight:700}
.appearance-mini-body{padding:7px}.appearance-mini-greeting{font-size:9px;font-weight:700;margin-bottom:2px}.appearance-mini-subtitle{font-size:6px;color:var(--mini-muted);margin-bottom:6px}
.appearance-mini-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.appearance-mini-card{height:33px;border-radius:5px;padding:5px 3px;background:var(--mini-card);font-size:8px;font-weight:700}.appearance-mini-card small{display:block;font-size:5px;font-weight:400;color:var(--mini-muted);margin-top:3px}
.appearance-mini-modules{display:flex;gap:4px;margin-top:6px}.appearance-mini-modules span{height:15px;flex:1;border-radius:4px;background:var(--mini-card);border:1px solid color-mix(in srgb,var(--mini-text) 8%,transparent)}
.appearance-choice-footer{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:8px;font-size:12px}.appearance-choice-footer strong{font-size:12px}.appearance-selected{font-size:9px;color:var(--accent);font-weight:700;visibility:hidden}.appearance-choice[aria-checked="true"] .appearance-selected{visibility:visible}
.appearance-swatches{display:flex;gap:5px;margin-top:7px}.appearance-swatches span{width:13px;height:13px;border-radius:50%;border:1px solid #00000018}.appearance-actions{display:flex;gap:9px;margin-top:16px}.appearance-actions button{flex:1;min-height:42px}.appearance-storage-note{font-size:11px;line-height:1.45;color:var(--muted);margin:13px 0 0}
@media(max-width:360px){.appearance-grid{gap:7px}.appearance-choice{padding:6px}.appearance-mini-body{padding:5px}.appearance-choice-footer strong{font-size:11px}}


.language-launcher{display:flex;align-items:center;gap:9px}.language-launcher .language-launch-label{flex:1}
.language-options{display:grid;gap:9px}
.language-choice{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border:2px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);text-align:left}
.language-choice[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.language-choice .language-flag{font-size:23px}.language-choice .language-name{flex:1;font-weight:600}.language-choice .language-check{color:var(--accent);font-weight:700;visibility:hidden}.language-choice[aria-checked="true"] .language-check{visibility:visible}

</style>

let selectedAppLanguage=appLanguage;
const appLanguages={es:{flag:'🇨🇱',name:'Español'},en:{flag:'🇺🇸',name:'English'},pt:{flag:'🇧🇷',name:'Português'}};
function languageChoiceHTML(key){const l=appLanguages[key];return '<button type="button" class="language-choice" role="radio" aria-checked="'+(selectedAppLanguage===key?'true':'false')+'" aria-label="Seleccionar idioma '+l.name+'" onclick="selectAppLanguage(\''+key+'\')"><span class="language-flag">'+l.flag+'</span><span class="language-name">'+l.name+'</span><span class="language-check">✓</span></button>'}
function openLanguageModal(){
 selectedAppLanguage=appLanguage;
 document.getElementById('modalTitle').textContent='Idioma de Enorden';
 const subtitle=document.getElementById('modalSubtitle');subtitle.textContent='Selecciona el idioma de tu aplicación.';subtitle.classList.remove('hidden');
 document.getElementById('modalBody').innerHTML='<div class="language-options" role="radiogroup" aria-label="Idiomas disponibles">'+Object.keys(appLanguages).map(languageChoiceHTML).join('')+'</div>'+
 '<div class="appearance-actions"><button type="button" class="secondary-btn" onclick="closeModal()">Cancelar</button><button type="button" class="primary-btn" onclick="saveAppLanguage()">Guardar</button></div>';
 document.getElementById('backdrop').classList.add('show');
}
function selectAppLanguage(value){if(!appLanguages[value])return;selectedAppLanguage=value;document.querySelectorAll('.language-choice').forEach(card=>card.setAttribute('aria-checked',String(card.getAttribute('aria-label')==='Seleccionar idioma '+appLanguages[value].name)))}
function saveAppLanguage(){if(!appLanguages[selectedAppLanguage])return;appLanguage=selectedAppLanguage;localStorage.setItem('enorden_language',appLanguage);closeModal();render()}

function applyAppearance(){document.body.dataset.theme=appTheme}
function appearanceCardHTML(key){
 const t=appearanceThemes[key],checked=selectedAppearanceTheme===key;
 const swatches=t.cards.map(c=>'<span style="background:'+c+'"></span>').join('');
 return '<button type="button" class="appearance-choice" role="radio" aria-checked="'+(checked?'true':'false')+'" aria-label="Seleccionar tema '+t.name+'" onclick="selectAppearanceTheme(\''+key+'\')">'+
  '<div class="appearance-mini" style="--mini-bg:'+t.bg+';--mini-header:'+t.header+';--mini-text:'+t.text+';--mini-muted:'+t.muted+';--mini-card:'+t.cards[0]+'">'+
   '<div class="appearance-mini-header"><span>Enorden</span><span>◉　⚙</span></div>'+
   '<div class="appearance-mini-body"><div class="appearance-mini-greeting">Hola Vale 👋</div><div class="appearance-mini-subtitle">Tu resumen de hoy</div>'+
    '<div class="appearance-mini-cards"><div class="appearance-mini-card" style="--mini-card:'+t.cards[0]+'">2<small>Tareas</small></div><div class="appearance-mini-card" style="--mini-card:'+t.cards[1]+'">3<small>Eventos</small></div><div class="appearance-mini-card" style="--mini-card:'+t.cards[2]+'">1<small>Compras</small></div></div>'+
    '<div class="appearance-mini-modules"><span></span><span></span><span></span><span></span></div></div></div>'+
  '<div class="appearance-choice-footer"><strong>'+t.name+'</strong><span class="appearance-selected">✓ Seleccionado</span></div><div class="appearance-swatches">'+swatches+'</div></button>';
}
function openAppearanceModal(){
 selectedAppearanceTheme=appTheme;document.getElementById('modalTitle').textContent='Apariencia de Enorden';
 const subtitle=document.getElementById('modalSubtitle');subtitle.textContent='Selecciona el estilo visual que prefieras. Puedes cambiarlo cuando quieras.';subtitle.classList.remove('hidden');
 document.getElementById('modalBody').innerHTML='<div class="appearance-grid" role="radiogroup" aria-label="Temas de apariencia">'+Object.keys(appearanceThemes).map(appearanceCardHTML).join('')+'</div>'+
 '<p class="appearance-storage-note">En esta versión de prueba, tu elección se guarda en este dispositivo. La personalización sincronizada por cuenta estará disponible cuando Enorden incorpore el sistema de usuarios.</p>'+
 '<div class="appearance-actions"><button type="button" class="secondary-btn" onclick="closeModal()">Cancelar</button><button type="button" class="primary-btn" onclick="saveAppearanceTheme()">Guardar</button></div>';
 document.getElementById('backdrop').classList.add('show');
}
function selectAppearanceTheme(key){
 if(!appearanceThemes[key])return;selectedAppearanceTheme=key;
 document.querySelectorAll('.appearance-choice').forEach(card=>card.setAttribute('aria-checked',String(card.getAttribute('aria-label')==='Seleccionar tema '+appearanceThemes[key].name)));
}
function saveAppearanceTheme(){
 if(!appearanceThemes[selectedAppearanceTheme])return;
 appTheme=selectedAppearanceTheme;localStorage.setItem('enorden_theme',appTheme);closeModal();render();
}

function applyLanguage(){
 if(appLanguage==='es')return;
 const dict=languageText[appLanguage],root=document.querySelector('.app');
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(node=>{const raw=node.nodeValue,trimmed=raw.trim();if(dict[trimmed])node.nodeValue=raw.replace(trimmed,dict[trimmed])});
 root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>['placeholder','aria-label','title'].forEach(attr=>{const v=el.getAttribute(attr);if(v&&dict[v])el.setAttribute(attr,dict[v])}));
}
function render(){
 applyAppearance();
 if(current==='notificaciones'&&notificationsOpened){notifications=notifications.slice(-3);localStorage.setItem('enorden_notifications',JSON.stringify(notifications))}
 renderNav();
 if(current==='inicio')renderHome();
 else if(current==='calendario')renderCalendar();
 else if(current==='tareas')renderTasks();
 else if(current==='listas')renderLists();
 else if(current==='notificaciones')renderNotifications();
 else if(current==='configuracion')renderSettings();
 else if(current==='finanzas')renderFinance();
 else if(current==='chat')renderChat();
 else renderOther(current);
 applyLanguage();
}

 const shopping=products.filter(p=>!p.bought).length;
 const todayKey=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 const upcoming=events.filter(e=>e.date>=todayKey).length;
 screen.innerHTML=`
 <div class="dayline"><strong>${day},</strong><span>${date}</span></div>
 <div class="greeting">Hola Vale 👋</div>
 <div class="weather"><span class="weather-icon">☀️</span><span>22 °C</span></div>
 <p class="summary-intro">Este es tu resumen de hoy.</p>
 <div class="searchbox">
  <input id="homeSearch" placeholder="Buscar en tu hogar...">
  <button onclick="voiceSearch()" aria-label="Buscar por voz">🎙</button>
  <button onclick="doSearch()" aria-label="Buscar">⌕</button>
 </div>

function voiceSearch(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert('La búsqueda por voz no está disponible en este navegador. Puedes escribir tu búsqueda.');return}
 const rec=new SR();rec.lang='es-CL';rec.onresult=e=>{
 document.getElementById('homeSearch').value=e.results[0][0].transcript;doSearch()};
 rec.start();
}
/* Reordenamiento común para Inicio y navegación inferior */
function enableReorder(container){
 if(!container)return;
 let timer=null,source=null,active=false;
 container.querySelectorAll('[data-module]').forEach(el=>{
  el.addEventListener('pointerdown',()=>{
   source=el;active=false;
   timer=setTimeout(()=>{active=true;el.style.opacity='.55'},500);
  });
  el.addEventListener('pointermove',e=>{
   if(!active||!source)return;
   const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-module]');
   if(target&&target!==source&&target.parentElement===container){
    const a=[...container.children].indexOf(source);
    const b=[...container.children].indexOf(target);
    if(a<b)container.insertBefore(source,target.nextSibling);
    else container.insertBefore(source,target);
   }
  });
  ['pointerup','pointercancel','pointerleave'].forEach(evt=>el.addEventListener(evt,()=>{
   clearTimeout(timer);
   if(active){
    const newOrder=[...container.querySelectorAll('[data-module]')].map(x=>x.dataset.module);
    order=newOrder;save();render();
   }
   if(source)source.style.opacity='';
   active=false;source=null;
  }));
 });
}
function renderCalendar(){
 const d=selectedDate,y=d.getFullYear(),m=d.getMonth(),on=date=>events.filter(ev=>eventOccursOn(ev,date));
 const borderColor=list=>{const ev=list.find(x=>x.priority==='high'&&x.color);return ev?ev.color:''};
 const typeLabel={normal:'Evento normal',birthday:'Cumpleaños',anniversary:'Aniversario',special:'Fecha especial o feriado'};
 const eventCard=ev=>'<button type="button" class="card" onclick="openEventDetails('+ev.id+')" style="display:block;width:100%;text-align:left;cursor:pointer;margin-top:12px;border-left:5px solid '+(ev.priority==='high'&&ev.color?ev.color:'var(--line)')+'"><strong>'+({birthday:'🎂 ',anniversary:'💐 ',special:'✨ ',normal:'📌 '}[ev.type]||'📌 ')+escapeHTML(ev.title)+'</strong><div class="muted" style="font-size:12px;margin-top:5px">'+(ev.allDay?'Todo el día':escapeHTML(ev.time||''))+' · '+(typeLabel[ev.type]||'Evento')+'</div>'+(ev.alerts?.length?'<span class="pill">🔔 '+ev.alerts.length+' alerta(s)</span>':'')+'</button>'
 let content='';
 if(calendarView==='Año'){
  content='<div class="year-grid">'+months.map((name,i)=>{
   const first=(new Date(y,i,1).getDay()+6)%7,total=new Date(y,i+1,0).getDate();
   const cells=Array.from({length:first},()=>'<span></span>').concat(Array.from({length:total},(_,n)=>{const list=on(new Date(y,i,n+1)),color=borderColor(list);return '<span class="calendar-day '+(list.length?'has-event ':'')+(color?'high-priority':'')+'" style="'+(color?'--event-border:'+color+';':'')+'">'+(n+1)+'</span>'})).join('');
   return '<button class="year-month" onclick="selectedDate=new Date('+y+','+i+',1);calendarView=\'Mes\';render()"><strong>'+name+'</strong><div class="year-days">'+weekdays.map(w=>'<span>'+w[0]+'</span>').join('')+cells+'</div></button>';
  }).join('')+'</div>';
 }else if(calendarView==='Día'){
  const list=on(d);content='<strong>'+d.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'})+'</strong>'+(list.map(eventCard).join('')||'<div class="empty">No hay eventos para este día.</div>');
 }else if(calendarView==='Semana'){
  const start=new Date(d);start.setDate(d.getDate()-((d.getDay()+6)%7));
  content='<div class="calendar-grid">'+weekdays.map(w=>'<div class="weekday">'+w+'</div>').join('')+Array.from({length:7},(_,i)=>{const x=new Date(start);x.setDate(start.getDate()+i);const list=on(x),color=borderColor(list);return '<div class="calendar-day '+(list.length?'has-event ':'')+(color?'high-priority':'')+'" style="'+(color?'--event-border:'+color+';':'')+'" onclick="selectedDate=new Date('+x.getFullYear()+','+x.getMonth()+','+x.getDate()+');calendarView=\'Día\';render()">'+x.getDate()+'</div>'}).join('')+'</div>';
 }else{
  const offset=(new Date(y,m,1).getDay()+6)%7,total=new Date(y,m+1,0).getDate();
  content='<div class="calendar-grid">'+weekdays.map(w=>'<div class="weekday">'+w+'</div>').join('')+Array.from({length:offset},()=>'<div></div>').join('')+Array.from({length:total},(_,i)=>{const n=i+1,list=on(new Date(y,m,n)),color=borderColor(list);return '<div class="calendar-day '+(n===new Date().getDate()&&m===new Date().getMonth()&&y===new Date().getFullYear()?'today ':'')+(list.length?'has-event ':'')+(color?'high-priority':'')+'" style="'+(color?'--event-border:'+color+';':'')+'" onclick="selectedDate=new Date('+y+','+m+','+n+');calendarView=\'Día\';render()">'+n+'</div>'}).join('')+'</div>';
 }
 const upcoming=events.slice().sort((a,b)=>a.date.localeCompare(b.date));
 screen.innerHTML='<div class="page-heading"><h1>Calendario</h1><p>Organiza las fechas importantes de tu hogar.</p></div><div class="toolbar">'+['Año','Mes','Semana','Día'].map(v=>'<button class="small-btn '+(calendarView===v?'active':'')+'" onclick="calendarView=\''+v+'\';render()">'+v+'</button>').join('')+'</div><div class="card"><div class="card-row"><button class="small-btn" onclick="changeDate(-1)">‹</button><strong>'+(calendarView==='Año'?y:calendarView==='Día'?d.toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'}):months[m]+' '+y)+'</strong><button class="small-btn" onclick="changeDate(1)">›</button></div><div style="margin-top:16px">'+content+'</div></div><div class="section '+(calendarView==='Día'?'hidden':'')+'"><h2>Próximos eventos</h2>'+(upcoming.map(ev=>'<div class="card card-row" style="border-left:5px solid '+(ev.priority==='high'&&ev.color?ev.color:'var(--line)')+'"><div>'+escapeHTML(ev.title)+'<div class="muted" style="font-size:12px;margin-top:5px">'+escapeHTML(ev.date)+' · '+(ev.allDay?'Todo el día':escapeHTML(ev.time||''))+'</div></div>'+(ev.alerts?.length?'<span class="pill">🔔 '+ev.alerts.length+'</span>':'')+'</div>').join('')||'<div class="card empty">No hay eventos registrados todavía.</div>')+'</div><div class="bottom-space"></div>';
}
function keyDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function changeDate(n){
 if(calendarView==='Año')selectedDate.setFullYear(selectedDate.getFullYear()+n);
 else if(calendarView==='Mes')selectedDate.setMonth(selectedDate.getMonth()+n);
 else if(calendarView==='Semana')selectedDate.setDate(selectedDate.getDate()+7*n);
 else selectedDate.setDate(selectedDate.getDate()+n);
 render();
}

function taskHTML(t){
 return `<div class="task-row"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${t.id})"><span class="task-name ${t.done?'done':''}">${escapeHTML(t.title)}</span><button class="small-btn" onclick="deleteTask(${t.id})">×</button></div>`;
}
function toggleTask(id){const t=tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}
function deleteTask(id){tasks=tasks.filter(x=>x.id!==id);save();render()}

function loadProfileCropImage(source){
 const img=new Image();
 img.onload=()=>{
  profileCropState={image:img,source:source,zoom:1,x:0,y:0,rotation:0};
  const controls=document.getElementById('profileCropControls');if(controls)controls.style.display='block';
  drawProfileCrop(document.getElementById('profilePreview'),180);
 };
 img.onerror=()=>alert('No se pudo abrir esta imagen. Prueba con otro archivo.');
 img.src=source;
}
function drawProfileCrop(canvas,size){
 if(!profileCropState)return;
 const state=profileCropState,img=state.image,ctx=canvas.getContext('2d');
 canvas.width=size;canvas.height=size;ctx.clearRect(0,0,size,size);
 const rad=state.rotation*Math.PI/180,c=Math.abs(Math.cos(rad)),sn=Math.abs(Math.sin(rad));
 const rotatedW=img.width*c+img.height*sn,rotatedH=img.width*sn+img.height*c;
 const scale=Math.max(size/rotatedW,size/rotatedH)*state.zoom;
 ctx.save();ctx.translate(size/2+state.x*size/100,size/2+state.y*size/100);ctx.rotate(rad);ctx.scale(scale,scale);
 ctx.drawImage(img,-img.width/2,-img.height/2);ctx.restore();
}
function profilePointerMetrics(){
 const pts=Array.from(profilePointers.values());
 if(!pts.length)return null;
 if(pts.length===1)return {x:pts[0].x,y:pts[0].y};
 const a=pts[0],b=pts[1],dx=b.x-a.x,dy=b.y-a.y;
 return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,distance:Math.hypot(dx,dy),angle:Math.atan2(dy,dx)};
}
function profileCropPointerDown(event){
 if(!profileCropState)return;
 event.preventDefault();event.currentTarget.setPointerCapture(event.pointerId);
 profilePointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
 const m=profilePointerMetrics(),state=profileCropState;
 profileGesture={count:profilePointers.size,x:m.x,y:m.y,zoom:state.zoom,offsetX:state.x,offsetY:state.y,rotation:state.rotation,distance:m.distance||0,angle:m.angle||0};
}
function profileCropPointerMove(event){
 if(!profileCropState||!profilePointers.has(event.pointerId))return;
 event.preventDefault();profilePointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
 const m=profilePointerMetrics(),state=profileCropState,canvas=document.getElementById('profilePreview');
 if(!m||!profileGesture)return;
 if(profilePointers.size===1){
  const rect=canvas.getBoundingClientRect();
  state.x=profileGesture.offsetX+(m.x-profileGesture.x)/rect.width*100;
  state.y=profileGesture.offsetY+(m.y-profileGesture.y)/rect.height*100;
 }else if(profilePointers.size>=2&&m.distance&&profileGesture.distance){
  state.zoom=Math.max(1,Math.min(4,profileGesture.zoom*m.distance/profileGesture.distance));
  let delta=m.angle-profileGesture.angle;
  while(delta>Math.PI)delta-=Math.PI*2;
  while(delta< -Math.PI)delta+=Math.PI*2;
  state.rotation=profileGesture.rotation+delta*180/Math.PI;
  const rect=canvas.getBoundingClientRect();
  state.x=profileGesture.offsetX+(m.x-profileGesture.x)/rect.width*100;
  state.y=profileGesture.offsetY+(m.y-profileGesture.y)/rect.height*100;
 }
 drawProfileCrop(canvas,180);
}
function profileCropPointerUp(event){
 profilePointers.delete(event.pointerId);
 if(profilePointers.size){
  const m=profilePointerMetrics(),state=profileCropState;
  profileGesture={count:profilePointers.size,x:m.x,y:m.y,zoom:state.zoom,offsetX:state.x,offsetY:state.y,rotation:state.rotation,distance:m.distance||0,angle:m.angle||0};
 }else profileGesture=null;
}
function rotateProfileCrop(degrees){
 if(!profileCropState)return;
 profileCropState.rotation+=degrees;
 drawProfileCrop(document.getElementById('profilePreview'),180);
}
function previewProfileImage(event){
 const file=event.target.files&&event.target.files[0];if(!file)return;
 if(!file.type.startsWith('image/')){alert('Elige un archivo de imagen.');return}
 if(file.size>15*1024*1024){alert('La imagen es demasiado grande. Elige una de menos de 15 MB.');event.target.value='';return}
 const reader=new FileReader();
 reader.onload=()=>{const p=document.getElementById('profilePreview');p.dataset.avatar='';profilePointers=new Map();profileGesture=null;loadProfileCropImage(reader.result);document.querySelectorAll('.avatar-choice').forEach(b=>b.classList.remove('selected'));};
 reader.onerror=()=>alert('No se pudo leer el archivo. Inténtalo nuevamente.');
 reader.readAsDataURL(file);
}

}

 if(!mustAlways&&financeLockChoice==='unset'){

  document.getElementById('modalBody').innerHTML=`

async function hashFinancePin(value){
 const bytes=new TextEncoder().encode(value);
 const digest=await crypto.subtle.digest('SHA-256',bytes);
 return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function saveFinancePin(){
 const pin=document.getElementById('financePinNew').value;
 const confirm=document.getElementById('financePinConfirm').value;
 if(!/^\d{4}$/.test(pin)){alert('El PIN debe tener exactamente 4 números.');return}
 if(pin!==confirm){alert('Los PIN no coinciden.');return}
 financePinHash=await hashFinancePin(pin);localStorage.setItem('enorden_finance_pin_hash',financePinHash);
 closeModal();
 if(financeSetupContext==='finance')enterFinance();else renderSettings();
}
async function verifyFinancePin(){
 const pin=document.getElementById('financePinEntry').value;
 if(!/^\d{4}$/.test(pin)){alert('Ingresa un PIN de 4 números.');return}
 const candidate=await hashFinancePin(pin);
 if(candidate!==financePinHash){alert('El PIN no es correcto.');return}
 enterFinance();
}

function eventRepeatLabel(ev){const names=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];if(ev.repeat==='yearly')return 'Anualmente';if(ev.repeat==='monthly')return 'Cada mes';if(ev.repeat==='daily')return 'Diariamente';if(ev.repeat==='custom')return 'Semanalmente: '+(ev.weekdays||[]).map(i=>names[i]).join(', ');return 'No se repite'}
function eventDetailMarkup(ev){
 const type={normal:'Evento normal',birthday:'Cumpleaños',anniversary:'Aniversario',special:'Fecha especial o feriado'}[ev.type]||'Evento';
 const date=ev.date?new Date(ev.date+'T12:00:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Sin fecha';
 const rows=[['Tipo',type],['Fecha',date],['Hora',ev.allDay?'Todo el día':(ev.time||'Sin hora')],['Repetición',eventRepeatLabel(ev)],['Alertas',ev.alerts?.length?ev.alerts.map(a=>a.amount+' '+({minutes:'minutos',hours:'horas',days:'días'}[a.unit]||a.unit)+' antes').join(', '):'Sin alertas'],['Calendario',ev.scope==='family'?'Compartido':'Personal'],['Vínculos',(ev.links||[]).length?ev.links.map(l=>({task:'Tareas',note:'Notas',expense:'Finanzas'}[l.type]||l.type)).join(', '):'Ninguno'],['Prioridad',ev.priority==='high'?'Alta':'Normal']];
 return '<div class="event-detail-card" style="border-left:5px solid '+(ev.priority==='high'&&ev.color?ev.color:'var(--line)')+'"><div class="event-detail-title">'+escapeHTML(ev.title)+'</div><div class="event-detail-list">'+rows.map(r=>'<div class="event-detail-row"><span class="event-detail-label">'+r[0]+'</span><span class="event-detail-value">'+escapeHTML(r[1])+'</span></div>').join('')+'</div></div>';

function deleteEvent(id){
 const ev=events.find(x=>String(x.id)===String(id));if(!ev)return;
 events=events.filter(x=>String(x.id)!==String(id));eventCountdowns=eventCountdowns.filter(x=>String(x.eventId)!==String(id));localStorage.setItem('enorden_event_countdowns',JSON.stringify(eventCountdowns));save();closeModal();render();
}
function duplicateEvent(id){
 const ev=events.find(x=>String(x.id)===String(id));if(!ev)return;
 eventPrefill=JSON.parse(JSON.stringify(ev));editingEventId=null;
 document.getElementById('modalTitle').textContent='Duplicar evento';
 const sub=document.getElementById('modalSubtitle');sub.textContent='Se creará un evento nuevo con los datos precargados. Puedes modificarlos libremente.';sub.classList.remove('hidden');
 document.getElementById('modalBody').innerHTML='<div class="event-form-section"><label>Tipo de evento</label><select id="eventType" onchange="showEventFields()"><option value="">Selecciona un tipo de evento</option><option value="normal">Evento normal</option><option value="birthday">Cumpleaños</option><option value="anniversary">Aniversario</option><option value="special">Fecha especial o feriado</option></select></div><div id="eventFields"></div>';
 document.getElementById('eventType').value=ev.type;showEventFields();document.getElementById('backdrop').classList.add('show');
}
function openEventMore(id){
 const ev=events.find(x=>String(x.id)===String(id));if(!ev)return;
 document.getElementById('modalTitle').textContent='Más opciones';
 const sub=document.getElementById('modalSubtitle');sub.textContent='Agrega una cuenta regresiva a tu Inicio.';sub.classList.remove('hidden');
 const exists=eventCountdowns.some(x=>String(x.eventId)===String(id));
 document.getElementById('modalBody').innerHTML='<div class="card"><strong>'+escapeHTML(ev.title)+'</strong><p class="muted" style="margin:8px 0 0">'+(exists?'Este evento ya tiene una cuenta regresiva en Inicio.':'Puedes mostrar cuánto falta para este evento debajo de las tarjetas de Inicio.')+'</p></div>'+(exists?'<button class="secondary-btn" style="width:100%" onclick="confirmDeleteEventCountdown('+ev.id+')">Eliminar cuenta regresiva</button>':'<button class="primary-btn" style="width:100%" onclick="createEventCountdown('+ev.id+')">Crear cuenta regresiva</button>');
}
function confirmDeleteEventCountdown(id){
 const ev=events.find(x=>String(x.id)===String(id));if(!ev)return;
 document.getElementById('modalTitle').textContent='Eliminar cuenta regresiva';
 const sub=document.getElementById('modalSubtitle');sub.textContent='Confirma si deseas quitarla de Inicio.';sub.classList.remove('hidden');
 document.getElementById('modalBody').innerHTML='<div class="card"><strong>'+escapeHTML(ev.title)+'</strong><p class="muted" style="margin:8px 0 0">¿Quieres eliminar la cuenta regresiva de Inicio? El evento seguirá en tu calendario.</p></div><div class="event-detail-actions"><button class="secondary-btn" onclick="openEventMore('+ev.id+')">Cancelar</button><button class="primary-btn" onclick="deleteEventCountdown('+ev.id+')">Sí, eliminar</button></div>';
}
function deleteEventCountdown(id){
 eventCountdowns=eventCountdowns.filter(x=>String(x.eventId)!==String(id));
 localStorage.setItem('enorden_event_countdowns',JSON.stringify(eventCountdowns));
 closeModal();render();
}
function createEventCountdown(id){
 const ev=events.find(x=>String(x.id)===String(id));if(!ev)return;
 if(!ev.date||new Date(ev.date+'T23:59:59')<new Date()){alert('La fecha del evento ya pasó. Edita el evento y elige una fecha futura para crear su cuenta regresiva.');return}
 if(!eventCountdowns.some(x=>String(x.eventId)===String(id)))eventCountdowns.push({eventId:ev.id,title:ev.title,date:ev.date});
 localStorage.setItem('enorden_event_countdowns',JSON.stringify(eventCountdowns));closeModal();render();
}
function renderCountdownWidgets(){
 if(!eventCountdowns.length)return '';
 const today=new Date();today.setHours(0,0,0,0);
 return '<section class="section" aria-label="Cuentas regresivas">'+eventCountdowns.map(c=>{const target=new Date(c.date+'T00:00:00'),days=Math.max(0,Math.ceil((target-today)/86400000));return '<button type="button" class="countdown-card" onclick="openEventDetails('+c.eventId+')" style="display:block;width:100%;text-align:left;cursor:pointer;color:inherit"><div class="muted" style="font-size:11px">CUENTA REGRESIVA</div><strong>'+escapeHTML(c.title)+'</strong><div class="countdown-number">'+(days===0?'¡Es hoy!':days+' '+(days===1?'día':'días'))+'</div><div class="countdown-caption">'+target.toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'})+'</div></button>'}).join('')+'</section>';
}
function openEditEvent(id){
 const ev=events.find(x=>String(x.id)===String(id));if(!ev)return;
 editingEventId=ev.id;
 const sub=document.getElementById('modalSubtitle');document.getElementById('modalTitle').textContent='Editar evento';
 sub.textContent='Modifica los detalles del evento. El tipo no se puede cambiar.';sub.classList.remove('hidden');
 document.getElementById('modalBody').innerHTML='<div class="event-form-section"><label>Tipo de evento</label><select id="eventType" disabled><option value="normal">Evento normal</option><option value="birthday">Cumpleaños</option><option value="anniversary">Aniversario</option><option value="special">Fecha especial o feriado</option></select></div><div id="eventFields"></div>';
 document.getElementById('eventType').value=ev.type;showEventFields();document.getElementById('backdrop').classList.add('show');
}
function showEventFields(){
 const type=document.getElementById('eventType').value,w=document.getElementById('eventFields');if(!type){w.innerHTML='';return}
 const ev=editingEventId!==null?events.find(e=>String(e.id)===String(editingEventId)):eventPrefill;
 const preset=ev?.date||(calendarView==='Día'?keyDate(selectedDate):'');
 const times=Array.from({length:96},(_,i)=>{const h=String(Math.floor(i/4)).padStart(2,'0'),m=String(i%4*15).padStart(2,'0');return '<option value="'+h+':'+m+'">'+h+':'+m+'</option>'}).join('');
 const taskOptions=tasks.map(t=>'<option value="'+t.id+'">'+escapeHTML(t.title)+'</option>').join('');
 w.innerHTML=
 '<div class="event-form-section"><label>Nombre</label><input id="eventName" placeholder="Nombre del evento" oninput="updateEventPreview()"></div>'+
 '<div class="event-two-col"><div class="event-form-section"><span class="field-label">Fecha</span><input id="eventDate" type="date" value="'+preset+'" onchange="updateEventPreview()"></div><div class="event-form-section" id="eventTimeWrap"><span class="field-label">Hora</span><select id="eventTime" onchange="updateEventPreview()">'+times+'</select></div></div>'+
 '<div class="event-form-section"><label class="event-choice"><input id="eventAllDay" type="checkbox" onchange="toggleEventAllDay()"> Todo el día</label></div>'+
 '<div class="event-form-section"><span class="field-label">¿Dónde se verá?</span><div class="event-choice-row"><label class="event-choice"><input type="radio" name="eventScope" value="personal" checked onchange="updateEventPreview()"> Mi calendario personal</label><label class="event-choice"><input type="radio" name="eventScope" value="family" onchange="updateEventPreview()"> Calendario familiar</label></div></div>'+
 '<div class="event-form-section"><label>Prioridad</label><select id="eventPriority" onchange="toggleEventColor()"><option value="normal">Normal</option><option value="high">Alta prioridad: destacar el día en el calendario</option></select><div id="eventColorWrap" class="hidden"><label>Selecciona el color</label><input id="eventColor" class="event-color" type="color" value="#d65b4a" onchange="updateEventPreview()"></div></div>'+
 '<div class="event-form-section"><label>Repetición</label><select id="eventRepeat" onchange="toggleCustomDays();updateEventPreview()"><option value="none">No se repite</option><option value="yearly">Anualmente</option><option value="monthly">Mensualmente</option><option value="daily">Diariamente</option><option value="custom">Personalizado</option></select><div id="eventCustomDays" class="hidden"><span class="field-label">Repetir estos días</span><div class="event-days">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map((x,i)=>'<label><input type="checkbox" name="eventWeekday" value="'+i+'" onchange="updateEventPreview()"> '+x+'</label>').join('')+'</div></div></div>'+
 '<div class="event-form-section"><label>Alerta</label><select id="eventAlertState" onchange="toggleEventAlerts()"><option value="off">Desactivar</option><option value="on">Activar</option></select><div id="eventAlertsWrap" class="hidden"><div id="eventAlertRows"></div><button type="button" class="small-btn" onclick="addEventAlert()">+ Agregar otra alerta</button></div></div>'+
 '<div class="event-form-section"><span class="field-label">Conectar con otros módulos</span><label class="event-choice"><input id="linkTask" type="checkbox" onchange="toggleEventLink(\'task\')"> Vincular con una tarea</label><div id="linkTaskWrap" class="hidden"><select id="linkTaskId" onchange="updateEventPreview()">'+(taskOptions||'<option value="">No hay tareas guardadas</option>')+'</select></div><label class="event-choice"><input id="linkNote" type="checkbox" onchange="toggleEventLink(\'note\')"> Vincular con una nota</label><div id="linkNoteWrap" class="hidden"><input id="linkNoteId" oninput="updateEventPreview()" placeholder="Referencia de la nota (módulo en desarrollo)"></div><label class="event-choice"><input id="linkExpense" type="checkbox" onchange="toggleEventLink(\'expense\')"> Vincular con un gasto o presupuesto</label><div id="linkExpenseWrap" class="hidden"><input id="linkExpenseId" oninput="updateEventPreview()" placeholder="Referencia del gasto o presupuesto (módulo en desarrollo)"></div></div>'+
 '<div class="event-preview"><div class="field-label event-preview-heading">Vista previa</div><div id="eventPreview" class="event-preview-content"><div class="event-preview-title">Nombre del evento</div><div class="event-preview-row">Fecha por seleccionar</div></div></div>'+
 '<div class="event-form-actions"><button class="secondary-btn" onclick="closeModal()">Cancelar</button><button class="primary-btn" onclick="addEvent()">'+(ev?'Guardar cambios':'Guardar')+'</button></div>';
 if(type==='birthday'||type==='anniversary'){document.getElementById('eventRepeat').value='yearly';document.getElementById('eventAllDay').checked=true;document.getElementById('eventAllDay').disabled=true;document.getElementById('eventRepeat').disabled=true}
 if(type==='anniversary'){document.getElementById('eventPriority').value='high';document.getElementById('eventColor').value='#e88ab8'}
 if(ev){
  document.getElementById('eventName').value=ev.title||'';document.getElementById('eventDate').value=ev.date||'';document.getElementById('eventTime').value=ev.time||'09:00';
  document.getElementById('eventAllDay').checked=!!ev.allDay;document.querySelector('input[name="eventScope"][value="'+(ev.scope||'personal')+'"]').checked=true;
  document.getElementById('eventPriority').value=ev.priority||'normal';document.getElementById('eventColor').value=ev.color||'#d65b4a';document.getElementById('eventRepeat').value=ev.repeat||'none';
  document.querySelectorAll('input[name="eventWeekday"]').forEach(x=>x.checked=(ev.weekdays||[]).includes(Number(x.value)));
  toggleCustomDays();toggleEventColor();toggleEventAllDay();
  if(ev.alerts?.length){document.getElementById('eventAlertState').value='on';document.getElementById('eventAlertsWrap').classList.remove('hidden');ev.alerts.forEach(al=>{addEventAlert();const row=document.getElementById('eventAlertRows').lastElementChild;row.querySelector('input').value=al.amount;row.querySelector('select').value=al.unit})}
  (ev.links||[]).forEach(link=>{const k=link.type==='task'?'Task':link.type==='note'?'Note':link.type==='expense'?'Expense':null;if(!k)return;document.getElementById('link'+k).checked=true;toggleEventLink(link.type);const f=document.getElementById('link'+k+'Id');if(f)f.value=link.id});
 }else{if(type==='birthday'||type==='anniversary')toggleEventAllDay()}
 updateEventPreview();
}
function toggleEventAllDay(){const v=document.getElementById('eventAllDay').checked;document.getElementById('eventTimeWrap').classList.toggle('hidden',v);updateEventPreview()}
function toggleEventColor(){document.getElementById('eventColorWrap').classList.toggle('hidden',document.getElementById('eventPriority').value!=='high');updateEventPreview()}
function toggleCustomDays(){document.getElementById('eventCustomDays').classList.toggle('hidden',document.getElementById('eventRepeat').value!=='custom')}
function toggleEventAlerts(){const on=document.getElementById('eventAlertState').value==='on';document.getElementById('eventAlertsWrap').classList.toggle('hidden',!on);if(on&&!document.getElementById('eventAlertRows').children.length)addEventAlert();updateEventPreview()}
function addEventAlert(){const r=document.createElement('div');r.className='event-alert-row';r.innerHTML='<input type="number" min="1" value="15" aria-label="Cantidad" oninput="updateEventPreview()"><select onchange="updateEventPreview()"><option value="minutes">Minutos</option><option value="hours">Horas</option><option value="days">Días</option></select><button type="button" class="small-btn" onclick="this.parentElement.remove();updateEventPreview()">×</button>';document.getElementById('eventAlertRows').appendChild(r);updateEventPreview()}
function toggleEventLink(k){const id='link'+k[0].toUpperCase()+k.slice(1);document.getElementById(id+'Wrap').classList.toggle('hidden',!document.getElementById(id).checked)}
function updateEventPreview(){const p=document.getElementById('eventPreview');if(!p)return;const n=document.getElementById('eventName').value.trim()||'Nombre del evento',d=document.getElementById('eventDate').value,all=document.getElementById('eventAllDay').checked,t=document.getElementById('eventTime').value,high=document.getElementById('eventPriority').value==='high',c=document.getElementById('eventColor').value,repeat=document.getElementById('eventRepeat')?.value||'none',days=[...document.querySelectorAll('input[name="eventWeekday"]:checked')].map(x=>['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'][Number(x.value)]),scope=document.querySelector('input[name="eventScope"]:checked')?.value||'personal',alerts=collectEventAlerts();const dt=d?new Date(d+'T12:00:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Fecha por seleccionar';const repeatText={yearly:'Se repite anualmente',monthly:'Se repite cada mes',daily:'Se repite diariamente'}[repeat]||(repeat==='custom'&&days.length?'Se repite cada semana: '+days.join(', '):'');const alertText=alerts.map(a=>a.amount+' '+({minutes:'minuto(s)',hours:'hora(s)',days:'día(s)'}[a.unit]||a.unit)+' antes').join(', ');const links=[];if(document.getElementById('linkTask')?.checked){const sel=document.getElementById('linkTaskId'),label=sel?.selectedOptions?.[0]?.textContent;links.push('Tareas'+(label&&sel.value?' · '+label:''))}if(document.getElementById('linkNote')?.checked){const ref=document.getElementById('linkNoteId')?.value.trim();links.push('Notas'+(ref?' · '+ref:''))}if(document.getElementById('linkExpense')?.checked){const ref=document.getElementById('linkExpenseId')?.value.trim();links.push('Finanzas'+(ref?' · '+ref:''))}const rows=['<div class="event-preview-title">'+escapeHTML(n)+'</div>','<div class="event-preview-row">'+escapeHTML(dt)+'</div>','<div class="event-preview-row">'+escapeHTML(all?'Todo el día':(t||'Hora por seleccionar'))+'</div>',repeatText?'<div class="event-preview-row">↻ '+escapeHTML(repeatText)+'</div>':'',alerts.length?'<div class="event-preview-row">🔔 '+escapeHTML(alertText)+'</div>':'<div class="event-preview-row">Sin alertas</div>','<div class="event-preview-row">'+(scope==='family'?'Calendario compartido':'Calendario propio')+'</div>',links.length?'<div class="event-preview-row">Vinculado con: '+escapeHTML(links.join(', '))+'</div>':'','<div class="event-preview-row">'+(high?'Alta prioridad':'Prioridad normal')+'</div>'].filter(Boolean);p.innerHTML=rows.join('');p.style.borderLeft=high?'5px solid '+c:'1px solid var(--line)'}
function collectEventAlerts(){if(document.getElementById('eventAlertState').value!=='on')return [];return [...document.querySelectorAll('#eventAlertRows .event-alert-row')].map(r=>({amount:Number(r.querySelector('input').value)||0,unit:r.querySelector('select').value})).filter(a=>a.amount>0)}
function normalizedEventName(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function similarEventName(a,b){const x=normalizedEventName(a),y=normalizedEventName(b);if(!x||!y)return false;if(x===y)return true;const ax=new Set(x.split(' ').filter(w=>w.length>2)),by=new Set(y.split(' ').filter(w=>w.length>2));if(!ax.size||!by.size)return false;const shared=[...ax].filter(w=>by.has(w)).length;return shared/Math.min(ax.size,by.size)>=0.6}
function eventOccursOn(ev,date){const base=new Date((ev.date||'')+'T12:00:00'),target=new Date(date.getFullYear(),date.getMonth(),date.getDate());if(!ev.date||isNaN(base.getTime())||target<new Date(base.getFullYear(),base.getMonth(),base.getDate()))return false;const diff=Math.round((target-new Date(base.getFullYear(),base.getMonth(),base.getDate()))/86400000);if(!ev.repeat||ev.repeat==='none')return diff===0;if(ev.repeat==='daily')return true;if(ev.repeat==='monthly')return target.getDate()===base.getDate();if(ev.repeat==='yearly')return target.getMonth()===base.getMonth()&&target.getDate()===base.getDate();if(ev.repeat==='custom')return Array.isArray(ev.weekdays)&&ev.weekdays.includes((target.getDay()+6)%7);return diff===0}
function addEvent(){
 const name=document.getElementById('eventName')?.value.trim(),date=document.getElementById('eventDate')?.value;
 const old=editingEventId!==null?events.find(e=>String(e.id)===String(editingEventId)):null,type=document.getElementById('eventType')?.value;
 if(!type){alert('Selecciona el tipo de evento.');return}if(!name){alert('Escribe el nombre del evento.');return}if(!date){alert('Selecciona una fecha.');return}
 const repeat=document.getElementById('eventRepeat').value,days=[...document.querySelectorAll('input[name="eventWeekday"]:checked')].map(x=>Number(x.value));if(repeat==='custom'&&!days.length){alert('Selecciona al menos un día de la semana.');return}
 const allDay=document.getElementById('eventAllDay').checked,scope=document.querySelector('input[name="eventScope"]:checked')?.value||'personal',priority=document.getElementById('eventPriority').value,alerts=collectEventAlerts(),links=[];
 if(document.getElementById('linkTask').checked){const id=document.getElementById('linkTaskId')?.value;if(id)links.push({type:'task',id:Number(id)})}
 if(document.getElementById('linkNote').checked){const id=document.getElementById('linkNoteId').value.trim();if(id)links.push({type:'note',id})}
 if(document.getElementById('linkExpense').checked){const id=document.getElementById('linkExpenseId').value.trim();if(id)links.push({type:'expense',id})}
 const dup=events.find(e=>String(e.id)!==String(editingEventId)&&e.date===date&&similarEventName(e.title,name));if(dup&&!confirm('Ya existe un evento similar en esa fecha ('+dup.title+'). ¿Quieres '+(old?'guardar los cambios':'crearlo')+' de todas formas?'))return;
 const changes={title:name,type,date,time:allDay?null:document.getElementById('eventTime').value,allDay,scope,priority,color:priority==='high'?document.getElementById('eventColor').value:null,repeat,weekdays:repeat==='custom'?days:[],alerts,links};
 if(old)Object.assign(old,changes);else{const id=Date.now();events.push({id,seriesId:'series-'+id,...changes,createdAt:new Date().toISOString()})}
 editingEventId=null;eventPrefill=null;save();closeModal();render();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&current==='finanzas')startFinanceLockTimer()});
window.addEventListener('pagehide',()=>{if(current==='finanzas')startFinanceLockTimer()});
render();
</script>
</body>
</html>
